<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRUX — Classroom Saint Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #1a1f36; --navy-mid: #242a45; --navy-lt: #2f3659;
  --gold: #d4a574; --gold-lt: #e8c9a0; --gold-dk: #b8895a;
  --white: #ffffff;
  --border: rgba(255,255,255,0.1); --border-g: rgba(212,165,116,0.25);
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Inter', sans-serif; background: linear-gradient(160deg, #07090f 0%, #0f1222 60%, #07090f 100%);
  color: var(--white);
}

/* ─── CHROME ─────────────────────────────────────────────────────── */
.top-chrome {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.1rem 1.75rem; pointer-events: none;
}
.tc-logo { font-family: 'Playfair Display', serif; font-weight: 900; letter-spacing: 5px; font-size: 1rem; color: var(--gold); opacity: 0.85; }
.tc-exit {
  pointer-events: all; font-family: 'Inter', sans-serif; font-size: 0.68rem; font-weight: 600;
  letter-spacing: 1px; color: rgba(255,255,255,0.4); text-decoration: none;
  padding: 0.35rem 0.8rem; border: 1px solid rgba(255,255,255,0.12); border-radius: 20px;
  transition: all 0.15s;
}
.tc-exit:hover { color: var(--gold); border-color: rgba(212,165,116,0.4); }

.stage {
  height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 2rem 1rem;
}

/* ── Pack open state ── */
.pack-open-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.4rem; text-align: center; }
.po-eyebrow { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
.po-caption { font-family: 'Playfair Display', serif; font-style: italic; font-size: 0.95rem; color: rgba(255,255,255,0.4); max-width: 380px; }
.po-art { position: relative; cursor: pointer; border-radius: 14px; animation: pack-float 2.8s ease-in-out infinite; }
.po-art.no-img { width: 300px; height: 420px; border-radius: 14px; }
@keyframes pack-float { 0%,100%{transform:translateY(0) rotate(0deg)} 40%{transform:translateY(-10px) rotate(0.6deg)} 70%{transform:translateY(-5px) rotate(-0.4deg)} }
.po-img { width: 300px; height: 420px; object-fit: cover; object-position: center; border-radius: 14px; display: block; box-shadow: 0 0 50px rgba(212,165,116,0.28), 0 24px 60px rgba(0,0,0,0.7); transition: box-shadow 0.3s; }
.po-art:hover .po-img { box-shadow: 0 0 75px rgba(212,165,116,0.5), 0 24px 60px rgba(0,0,0,0.7); }
.po-tap { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.38); animation: tap-blink 1.8s ease-in-out infinite; transition: opacity 0.25s; }
@keyframes tap-blink { 0%,100%{opacity:0.38} 50%{opacity:0.85} }
.po-art.is-opening { animation: pack-rip 0.55s ease-in forwards !important; cursor: default; }
@keyframes pack-rip { 0%{transform:scale(1) rotate(0deg)} 15%{transform:scale(1.04) rotate(-3deg)} 30%{transform:scale(1.05) rotate(3deg)} 48%{transform:scale(1.07) rotate(-2deg)} 65%{transform:scale(1.18) rotate(1deg)} 82%{transform:scale(1.55) rotate(0deg);opacity:0.6} 100%{transform:scale(2.4) rotate(0deg);opacity:0} }

/* ── Loading bar ── */
.po-loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
.po-loading-cross { font-size: 2rem; opacity: 0.1; }
.po-loading-text { font-family: 'DM Mono', monospace; font-size: 0.54rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(212,165,116,0.4); }
.po-loading-bar-wrap { width: 180px; height: 2px; background: rgba(212,165,116,0.1); border-radius: 2px; overflow: hidden; }
.po-loading-bar { height: 100%; width: 0%; background: linear-gradient(90deg, #d4a574, #f0c878); border-radius: 2px; transition: width 0.15s ease; }

/* ── Cinematic single-card reveal ── */
.cinematic-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.5rem; }
.cinematic-counter { font-family: 'DM Mono', monospace; font-size: 0.52rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(212,165,116,0.35); }
.cinematic-stage { position: relative; display: flex; align-items: center; justify-content: center; }
.card-halo { position: absolute; inset: -50px; border-radius: 50%; background: radial-gradient(ellipse at center, rgba(212,165,116,0.2) 0%, transparent 65%); pointer-events: none; opacity: 0; transition: opacity 0.8s ease, background 0.4s ease; z-index: 0; }
.card-halo.visible { opacity: 1; }
.cin-card { width: 300px; height: 420px; position: relative; transform-style: preserve-3d; perspective: 1200px; cursor: pointer; z-index: 1; }
.cin-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.8s cubic-bezier(0.45, 0.05, 0.2, 1); }
.cin-card.flipped .cin-inner { transform: rotateY(180deg); }
.cin-back, .cin-front { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.cin-back { border: 1.5px solid rgba(212,165,116,0.2); box-shadow: 0 0 60px rgba(212,165,116,0.08), 0 24px 60px rgba(0,0,0,0.9); animation: cin-back-pulse 2s ease-in-out infinite; }
.cin-back-img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; border-radius: 16px; }
@keyframes cin-back-pulse { 0%,100%{border-color:rgba(212,165,116,0.15)} 50%{border-color:rgba(212,165,116,0.45)} }
.cin-front { transform: rotateY(180deg); border: 2px solid rgba(212,165,116,0.4); box-shadow: 0 0 60px rgba(212,165,116,0.25), 0 24px 60px rgba(0,0,0,0.9); background: linear-gradient(145deg, #1a1208, #2a1e10); display: flex; align-items: flex-end; }
.cin-saint-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.cin-front-overlay { position: relative; z-index: 2; width: 100%; padding: 1.35rem 1.2rem 1.15rem; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 65%, transparent 100%); text-align: center; }
.cin-name { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.3rem; color: #fff; margin-bottom: 0.35rem; text-shadow: 0 2px 8px rgba(0,0,0,0.8); line-height: 1.2; }
.cin-rarity { font-family: 'DM Mono', monospace; font-size: 0.58rem; letter-spacing: 2px; text-transform: uppercase; }
.cin-front.uncommon { border-color: rgba(180,200,220,0.5); }
.cin-front.uncommon .cin-rarity { color: #b4c8dc; }
.cin-front.rare { border-color: rgba(196,60,60,0.7); box-shadow: 0 0 60px rgba(196,60,60,0.25), 0 24px 60px rgba(0,0,0,0.9); }
.cin-front.rare .cin-rarity { color: #e87878; }
@keyframes cin-enter { 0%{transform:translateY(80px) scale(0.85);opacity:0} 55%{transform:translateY(-8px) scale(1.02);opacity:1} 100%{transform:translateY(0) scale(1);opacity:1} }
.cin-card.entering { animation: cin-enter 0.65s cubic-bezier(0.2, 0.85, 0.3, 1) forwards; }
.cin-tap-hint { font-family: 'DM Mono', monospace; font-size: 0.5rem; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(212,165,116,0.45); animation: tap-blink 1.8s ease-in-out infinite; transition: opacity 0.3s ease; }
.cin-next-btn { font-family: 'DM Mono', monospace; font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; background: transparent; border: 1px solid rgba(212,165,116,0.3); color: rgba(212,165,116,0.7); padding: 0.6rem 1.8rem; border-radius: 5px; cursor: pointer; opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity 0.4s ease, transform 0.4s ease, border-color 0.2s, color 0.2s; }
.cin-next-btn.visible { opacity: 1; pointer-events: all; transform: translateY(0); }
.cin-next-btn:hover { border-color: rgba(212,165,116,0.7); color: rgba(212,165,116,1); background: rgba(212,165,116,0.06); }
.cin-dots { display: flex; gap: 0.55rem; }
.cin-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(212,165,116,0.15); transition: background 0.4s, transform 0.4s; }
.cin-dot.done { background: rgba(212,165,116,0.7); transform: scale(1.3); }
.cin-dot.now { background: rgba(212,165,116,0.4); animation: dot-now 1s ease-in-out infinite; }
@keyframes dot-now { 0%,100%{transform:scale(1)} 50%{transform:scale(1.6)} }

/* ── Summary / choose-a-saint screen ── */
.summary-wrap { display: flex; flex-direction: column; align-items: center; gap: 1.6rem; width: 100%; }
.summary-eyebrow { font-family: 'DM Mono', monospace; font-size: 0.52rem; letter-spacing: 4px; text-transform: uppercase; color: rgba(212,165,116,0.4); }
.summary-title { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 1.5rem; color: #fff; text-align: center; margin-top: -0.75rem; }
.summary-hint { font-family: 'Inter', sans-serif; font-size: 0.85rem; color: rgba(255,255,255,0.45); text-align: center; max-width: 420px; margin-top: -0.75rem; }
.summary-cards-row { display: flex; gap: 0.9rem; justify-content: center; flex-wrap: wrap; max-width: 760px; }
.sum-card { width: 130px; height: 182px; border-radius: 12px; overflow: hidden; border: 1.5px solid rgba(212,165,116,0.2); background: linear-gradient(145deg,#1a1f36,#252b47); position: relative; transform: scale(0.85) translateY(20px); opacity: 0; transition: transform 0.5s ease, opacity 0.5s ease, border-color 0.2s, box-shadow 0.2s; cursor: pointer; }
.sum-card.in { transform: scale(1) translateY(0); opacity: 1; }
.sum-card:hover { border-color: rgba(212,165,116,0.5); }
.sum-card.selected { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 30px rgba(212,165,116,0.4); transform: scale(1.08) translateY(-6px); }
.sum-card-img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
.sum-card-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 0.45rem; background: linear-gradient(to top,rgba(0,0,0,0.9),transparent); font-family: 'Playfair Display', serif; font-size: 0.68rem; font-weight: 700; color: #fff; text-align: center; line-height: 1.25; }
.sum-card.rare { border-color: rgba(196,60,60,0.5); }
.sum-card.uncommon { border-color: rgba(180,200,220,0.3); }
.sum-card-check { position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%; background: var(--gold); color: var(--navy); font-size: 0.72rem; font-weight: 800; display: none; align-items: center; justify-content: center; }
.sum-card.selected .sum-card-check { display: flex; }

/* ── Actions ── */
.reveal-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
.deep-dive-btn { background: var(--gold); color: var(--navy); border: none; padding: 11px 22px; font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; border-radius: 5px; cursor: pointer; transition: opacity 0.2s; }
.deep-dive-btn:hover:not(:disabled) { opacity: 0.88; }
.deep-dive-btn:disabled { opacity: 0.3; cursor: default; }
.reveal-again-btn { background: transparent; border: 1px solid var(--border-g); color: rgba(255,255,255,0.6); padding: 11px 22px; font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 1.5px; text-transform: uppercase; border-radius: 5px; cursor: pointer; transition: all 0.2s; }
.reveal-again-btn:hover { color: var(--white); border-color: rgba(255,255,255,0.3); }

/* ── Rarity flash ── */
.reveal-flash { position: fixed; inset: 0; pointer-events: none; z-index: 500; opacity: 0; }
@keyframes flash-blue  { 0%{opacity:0} 12%{opacity:0.5}  100%{opacity:0} }
@keyframes flash-pack  { 0%{opacity:0} 8%{opacity:0.88}  100%{opacity:0} }
.reveal-flash.flash-rare { background: radial-gradient(ellipse at center, rgba(196,60,60,0.65) 0%, transparent 60%); animation: flash-blue 0.7s ease-out forwards; }
.reveal-flash.flash-pack { background: radial-gradient(ellipse at center, rgba(255,245,200,0.95) 0%, rgba(212,165,116,0.55) 30%, transparent 65%); animation: flash-pack 0.65s ease-out forwards; }

@media (max-width: 560px) {
  .po-art.no-img, .po-img { width: 220px; height: 308px; }
  .cin-card { width: 220px; height: 308px; }
  .sum-card { width: 96px; height: 134px; }
}
</style>
</head>
<body>

<div class="top-chrome">
  <div class="tc-logo">CRUX</div>
  <a href="crux-modules.html" class="tc-exit">Exit</a>
</div>

<div class="stage">
  <div id="revealFlash" class="reveal-flash"></div>

  <!-- State 1: Pack art + tap to open -->
  <div id="packOpenWrap" class="pack-open-wrap">
    <div class="po-eyebrow">Today's Saints · 5 Cards</div>
    <div class="po-art" id="poArt" onclick="triggerPackOpen()">
      <img id="poImg" src="images/packs/pack-premium.jpg" alt="Classroom Saint Pack" class="po-img" onerror="this.style.display='none'">
    </div>
    <p class="po-caption">A preset pack, the same five saints every time, so you know exactly who's coming before we open it.</p>
    <div class="po-tap" id="poTap">Tap to open</div>
  </div>

  <!-- State 2: Loading bar -->
  <div id="poLoadingWrap" class="po-loading-wrap" style="display:none">
    <span class="po-loading-cross">✟</span>
    <p class="po-loading-text" id="poLoadingText">Preparing your saints</p>
    <div class="po-loading-bar-wrap">
      <div class="po-loading-bar" id="poLoadingBar"></div>
    </div>
  </div>

  <!-- State 3: Cinematic single-card reveal -->
  <div id="cinematicWrap" class="cinematic-wrap" style="display:none">
    <p class="cinematic-counter" id="cinematicCounter">Card 1 of 5</p>
    <div class="cinematic-stage">
      <div class="card-halo" id="cardHalo"></div>
      <div class="cin-card" id="cinCard" onclick="flipCinCard()">
        <div class="cin-inner" id="cinInner">
          <div class="cin-back">
            <img class="cin-back-img" src="images/card-back.jpg" alt="CRUX card back" onerror="this.style.display='none'">
          </div>
          <div class="cin-front" id="cinFront">
            <img class="cin-saint-img" id="cinImg" src="" alt="">
            <div class="cin-front-overlay">
              <div class="cin-name" id="cinName"></div>
              <div class="cin-rarity" id="cinRarity"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <p class="cin-tap-hint" id="cinHint">Tap to reveal</p>
    <button class="cin-next-btn" id="cinNextBtn" onclick="cinNext()"></button>
    <div class="cin-dots" id="cinDots"></div>
  </div>

  <!-- State 4: Choose a saint -->
  <div id="summaryWrap" class="summary-wrap" style="display:none">
    <p class="summary-eyebrow">Pack Opened</p>
    <h2 class="summary-title">Which Saint Should We Explore?</h2>
    <p class="summary-hint">Take a class vote, then tap the winner.</p>
    <div class="summary-cards-row" id="summaryCardsRow"></div>
    <div class="reveal-actions">
      <button class="deep-dive-btn" id="deepDiveBtn" disabled onclick="goDeepDive()">Choose a Saint Above ↑</button>
      <button class="reveal-again-btn" onclick="resetPack()">Open Pack Again</button>
    </div>
  </div>
</div>

<script>
  // Fixed, preset pack — always these five saints, in this order.
  // Roughly chronological: Patrick, Francis, Joan of Arc, John Paul II, Carlo Acutis.
  var drawnCards = [
    { id: 'patrick',         name: 'St. Patrick',            rarity: 'rare' },
    { id: 'francis-assisi',  name: 'St. Francis of Assisi',  rarity: 'uncommon' },
    { id: 'joan-arc',        name: 'St. Joan of Arc',        rarity: 'rare' },
    { id: 'john-paul-ii',    name: 'St. John Paul II',       rarity: 'rare' },
    { id: 'carlo-acutis',    name: 'St. Carlo Acutis',       rarity: 'rare' }
  ];

  var cinCurrentIdx = 0;
  var cinFlipped = false;
  var selectedCard = null;

  function rarityLabel(r) {
    return { rare: '✦✦ Rare', uncommon: '✦ Uncommon' }[r] || r;
  }

  function triggerPackOpen() {
    var art = document.getElementById('poArt');
    art.onclick = null;
    art.classList.add('is-opening');
    document.getElementById('poTap').style.opacity = '0';
    setTimeout(function() {
      var flash = document.getElementById('revealFlash');
      flash.className = 'reveal-flash';
      void flash.offsetWidth;
      flash.className = 'reveal-flash flash-pack';
      document.getElementById('packOpenWrap').style.display = 'none';
      document.getElementById('poLoadingWrap').style.display = 'flex';
      document.getElementById('poLoadingBar').style.width = '0%';
      document.getElementById('poLoadingText').textContent = 'Preparing your saints';
      runLoadingBar();
    }, 520);
  }

  function runLoadingBar() {
    var bar = document.getElementById('poLoadingBar');
    var lbl = document.getElementById('poLoadingText');
    var msgs = ['Preparing your saints', 'Invoking the saints', 'Almost ready'];
    var pct = 0, t = 0;
    var tick = setInterval(function() {
      pct += 3 + Math.random() * 5;
      if (pct > 100) pct = 100;
      bar.style.width = pct + '%';
      if (pct >= 35 && t === 0) { lbl.textContent = msgs[1]; t++; }
      if (pct >= 72 && t === 1) { lbl.textContent = msgs[2]; t++; }
      if (pct >= 100) {
        clearInterval(tick);
        setTimeout(function() {
          document.getElementById('poLoadingWrap').style.display = 'none';
          cinCurrentIdx = 0;
          cinFlipped = false;
          showCinCard(0);
        }, 350);
      }
    }, 55);
  }

  function buildCinDots(count) {
    var dots = document.getElementById('cinDots');
    dots.innerHTML = '';
    for (var i = 0; i < count; i++) {
      var d = document.createElement('div');
      d.className = 'cin-dot';
      d.id = 'cindot-' + i;
      dots.appendChild(d);
    }
  }

  function showCinCard(idx) {
    cinCurrentIdx = idx;
    cinFlipped = false;
    var card = drawnCards[idx];
    var cinCard = document.getElementById('cinCard');
    var cinFront = document.getElementById('cinFront');
    var cinHint = document.getElementById('cinHint');
    var cinNext = document.getElementById('cinNextBtn');
    var halo = document.getElementById('cardHalo');

    var cinInnerEl = document.getElementById('cinInner');
    cinInnerEl.style.transition = 'none';
    cinInnerEl.style.transform = '';
    cinCard.classList.remove('flipped', 'entering');
    void cinCard.offsetWidth;
    cinInnerEl.style.transition = '';
    cinFront.className = 'cin-front';
    document.getElementById('cinImg').src = 'images/saints/' + card.id + '.jpg';
    document.getElementById('cinImg').alt = card.name;
    document.getElementById('cinName').textContent = card.name;
    document.getElementById('cinRarity').textContent = rarityLabel(card.rarity);
    cinHint.style.opacity = '';
    cinNext.classList.remove('visible');
    halo.classList.remove('visible');
    cinNext.textContent = idx + 1 < drawnCards.length ? 'Next Saint →' : 'Choose a Saint';
    document.getElementById('cinematicCounter').textContent = 'Card ' + (idx + 1) + ' of ' + drawnCards.length;

    if (idx === 0) buildCinDots(drawnCards.length);
    for (var i = 0; i < drawnCards.length; i++) {
      var d = document.getElementById('cindot-' + i);
      if (!d) continue;
      d.className = 'cin-dot';
      if (i < idx) d.classList.add('done');
      else if (i === idx) d.classList.add('now');
    }

    document.getElementById('cinematicWrap').style.display = 'flex';
    void cinCard.offsetWidth;
    cinCard.classList.add('entering');
  }

  function flipCinCard() {
    if (cinFlipped) return;
    cinFlipped = true;
    var card = drawnCards[cinCurrentIdx];
    var cinCard = document.getElementById('cinCard');
    var cinFront = document.getElementById('cinFront');

    cinCard.classList.add('flipped');
    cinFront.classList.add(card.rarity);
    document.getElementById('cinHint').style.opacity = '0';

    var flash = document.getElementById('revealFlash');
    flash.className = 'reveal-flash';
    void flash.offsetWidth;
    if (card.rarity === 'rare') flash.classList.add('flash-rare');

    setTimeout(function() {
      document.getElementById('cinNextBtn').classList.add('visible');
    }, 900);
  }

  function cinNext() {
    var wrap = document.getElementById('cinematicWrap');
    wrap.style.opacity = '0';
    wrap.style.transition = 'opacity 0.3s ease';
    setTimeout(function() {
      wrap.style.opacity = '';
      wrap.style.transition = '';
      if (cinCurrentIdx + 1 < drawnCards.length) {
        showCinCard(cinCurrentIdx + 1);
      } else {
        wrap.style.display = 'none';
        showSummary();
      }
    }, 320);
  }

  function showSummary() {
    var row = document.getElementById('summaryCardsRow');
    row.innerHTML = '';
    selectedCard = null;
    var btn = document.getElementById('deepDiveBtn');
    btn.disabled = true;
    btn.textContent = 'Choose a Saint Above ↑';

    drawnCards.forEach(function(card, i) {
      var d = document.createElement('div');
      d.className = 'sum-card ' + card.rarity;
      d.style.transitionDelay = (i * 0.1) + 's';
      d.onclick = function() { selectSumCard(card, d); };
      d.innerHTML =
        '<img class="sum-card-img" src="images/saints/' + card.id + '.jpg" alt="' + card.name + '" onerror="this.style.display=\'none\'">' +
        '<div class="sum-card-check">✓</div>' +
        '<div class="sum-card-label">' + card.name.replace(/^(St\.|Bl\.) /, '') + '</div>';
      row.appendChild(d);
      setTimeout(function() { d.classList.add('in'); }, 80 + i * 110);
    });

    document.getElementById('summaryWrap').style.display = 'flex';
  }

  function selectSumCard(card, el) {
    document.querySelectorAll('.sum-card').forEach(function(c) { c.classList.remove('selected'); });
    el.classList.add('selected');
    selectedCard = card.id;
    var btn = document.getElementById('deepDiveBtn');
    btn.disabled = false;
    btn.textContent = 'Begin Deep Dive: ' + card.name.replace(/^(St\.|Bl\.) /, '') + ' →';
  }

  function goDeepDive() {
    if (!selectedCard) return;
    window.location.href = 'crux-deepdive-' + selectedCard + '.html';
  }

  function resetPack() {
    document.getElementById('summaryWrap').style.display = 'none';
    document.getElementById('cinematicWrap').style.display = 'none';
    document.getElementById('poLoadingWrap').style.display = 'none';
    document.getElementById('packOpenWrap').style.display = 'flex';
    var art = document.getElementById('poArt');
    art.classList.remove('is-opening');
    art.onclick = triggerPackOpen;
    document.getElementById('poTap').style.opacity = '1';
    selectedCard = null;
  }
</script>
</body>
</html>
