<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><path d="M70 880 V440.0 A320.0 320.0 0 0 1 710 440.0 V880 Z" fill="#f5f0e8" stroke="#d4a574" stroke-width="6"/><text x="390.0" y="80.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#c9a84c" letter-spacing="4">LOVE GOD</text><circle cx="140" cy="383.6" r="24.5" fill="#141829"/><text x="140.0" y="395.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27.88" font-weight="bold" fill="#f5f0e8">1</text><text x="186.0" y="395.2" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#141829">I am the Lord your God:</text><text x="186.0" y="435.3" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#141829">you shall not have strange</text><text x="186.0" y="475.4" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#141829">gods before me.</text><circle cx="140" cy="538.0" r="24.5" fill="#141829"/><text x="140.0" y="549.6" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27.88" font-weight="bold" fill="#f5f0e8">2</text><text x="186.0" y="549.6" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#141829">You shall not take the name</text><text x="186.0" y="589.7" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#141829">of the Lord your God in vain.</text><circle cx="140" cy="652.2" r="24.5" fill="#141829"/><text x="140.0" y="663.8" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27.88" font-weight="bold" fill="#f5f0e8">3</text><text x="186.0" y="663.8" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#141829">Remember to keep holy</text><text x="186.0" y="703.9" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="normal" fill="#141829">the Lord’s Day.</text><path d="M760 880 V505.0 A385.0 385.0 0 0 1 1530 505.0 V880 Z" fill="#f5f0e8" stroke="#d4a574" stroke-width="6"/><text x="1145.0" y="80.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="bold" fill="#c9a84c" letter-spacing="4">LOVE YOUR NEIGHBOR</text><circle cx="830" cy="441.6" r="20.2" fill="#141829"/><text x="830.0" y="451.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22.959999999999997" font-weight="bold" fill="#f5f0e8">4</text><text x="876.0" y="451.1" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">Honor your father and your mother.</text><circle cx="830" cy="486.6" r="20.2" fill="#141829"/><text x="830.0" y="496.1" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22.959999999999997" font-weight="bold" fill="#f5f0e8">5</text><text x="876.0" y="496.1" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">You shall not kill.</text><circle cx="830" cy="531.7" r="20.2" fill="#141829"/><text x="830.0" y="541.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22.959999999999997" font-weight="bold" fill="#f5f0e8">6</text><text x="876.0" y="541.2" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">You shall not commit adultery.</text><circle cx="830" cy="576.7" r="20.2" fill="#141829"/><text x="830.0" y="586.2" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22.959999999999997" font-weight="bold" fill="#f5f0e8">7</text><text x="876.0" y="586.2" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">You shall not steal.</text><circle cx="830" cy="621.7" r="20.2" fill="#141829"/><text x="830.0" y="631.3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22.959999999999997" font-weight="bold" fill="#f5f0e8">8</text><text x="876.0" y="631.3" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">You shall not bear false witness</text><text x="876.0" y="664.3" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">against your neighbor.</text><circle cx="830" cy="699.8" r="20.2" fill="#141829"/><text x="830.0" y="709.3" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22.959999999999997" font-weight="bold" fill="#f5f0e8">9</text><text x="876.0" y="709.3" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">You shall not covet your</text><text x="876.0" y="742.4" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">neighbor’s wife.</text><circle cx="830" cy="777.9" r="20.2" fill="#141829"/><text x="830.0" y="787.4" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22.959999999999997" font-weight="bold" fill="#f5f0e8">10</text><text x="876.0" y="787.4" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">You shall not covet your</text><text x="876.0" y="820.5" text-anchor="start" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="normal" fill="#141829">neighbor’s goods.</text></svg>