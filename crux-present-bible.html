function buildBodyLines(lines) {
  if (!lines.length) return '<div class="body-line" data-type="para" contenteditable="true" data-placeholder="Type here…"></div>';
  return lines.map(function(line) {
    var type = 'para', text = line;
    if (line.startsWith('- '))  { type = 'bullet';    text = line.slice(2); }
    else if (line.startsWith('★ ')) { type = 'highlight'; text = line.slice(2); }
    else if (line.startsWith('> ')) { type = 'quote';     text = line.slice(2); }
    return '<div class="body-line" data-type="' + type + '" contenteditable="true">' + escHtml(text) + '</div>';
  }).join('');
}

function attachEditListeners(slide) {
  var es = document.getElementById('editableSlide');
  if (!es) return;
  // Every caller of this function has just replaced #editableSlide's
  // innerHTML, which wipes any image-layer/text-box/drag-handle elements
  // along with it — re-render them and re-arm the drop zone here so
  // there's one place to keep in sync rather than several call sites.
  attachDropZone(es);
  renderImageLayers(es, slide);
  renderTextBoxes(es, slide);
  applyContentOffset(es, slide);
  renderContentDragHandle(es, slide);
  applyElementSizes(es, slide);
  markSizeKeys(es);
  attachElementDrag(es, slide);
  es.addEventListener('focusin', function(e) {
    var sizeEl = e.target.closest('.editable-field, .body-line, .pv-textbox-content');
    if (sizeEl) setSizeTarget(sizeEl);
    var line = e.target.closest('[data-type]');
    focusedLineEl = line || null;
    updateFmtToolbar(line ? line.dataset.type : null);
  });
  es.addEventListener('paste', function(e) {
    e.preventDefault();
    var text = e.clipboardData.getData('text/plain');
    document.execCommand('insertText', false, text);
  });
  es.addEventListener('keydown', function(e) {
    if ((e.metaKey || e.ctrlKey) && !e.shiftKey && !e.altKey && (e.key === 'b' || e.key === 'B' || e.key === 'i' || e.key === 'I')) {
      e.preventDefault();
      toggleInlineStyle(e.key.toLowerCase() === 'b' ? 'w' : 's');
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && (e.key === '>' || e.key === '.' || e.key === '<' || e.key === ',')) {
      e.preventDefault();
      stepSizeTarget(e.key === '>' || e.key === '.' ? 1 : -1);
      return;
    }
    var line = document.activeElement.closest('[data-type]');
    if (e.key === 'Enter' && line) {
      e.preventDefault();
      var newLine = document.createElement('div');
      newLine.className = 'body-line';
      newLine.dataset.type = line.dataset.type;
      newLine.contentEditable = 'true';
      newLine.innerHTML = '<br>';
      line.after(newLine);
      var range = document.createRange();
      range.setStart(newLine, 0); range.collapse(true);
      var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
      focusedLineEl = newLine;
      updateFmtToolbar(newLine.dataset.type);
    }
    if (e.key === 'Backspace' && line) {
      if (line.textContent.trim() === '' || line.innerHTML === '<br>') {
        var body = line.parentElement;
        if (body && body.querySelectorAll('[data-type]').length > 1) {
          e.preventDefault();
          var prev = line.previousElementSibling;
          line.remove();
          if (prev && prev.dataset.type) {
            prev.focus();
            var r = document.createRange();
            r.selectNodeContents(prev); r.collapse(false);
            var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          }
        }
      }
    }
  });
  es.addEventListener('input', function() { serializeFromCanvas(); });
}

function serializeFromCanvas() {
  var slide = slides[selectedIndex];
  if (!slide) return;
  var es = document.getElementById('editableSlide');
  if (!es) return;
  var bf = bodyTab === 'simple' ? 'bodySimple' : 'body';

  var titleEl = es.querySelector('[data-field="title"]');
  if (titleEl) slide.title = titleEl.textContent.trim();

  var soloEl = es.querySelector('[data-field="body-solo"]');
  if (soloEl) {
    slide[bf] = soloEl.textContent;
    if (bf === 'body' && !slide.bodySimple) slide.bodySimple = slide.body;
    if (bf === 'bodySimple' && !slide.body) slide.body = slide.bodySimple;
  }

  var q0El = es.querySelector('[data-field="body-q0"]');
  var bodyEl = es.querySelector('#editableBody');
  if (bodyEl) {
    var bodyText = serializeBodyEl(bodyEl);
    if (q0El) {
      slide[bf] = q0El.textContent.trim() + (bodyText ? '\n' + bodyText : '');
    } else {
      slide[bf] = bodyText;
    }
    if (bf === 'body' && !slide.bodySimple) slide.bodySimple = slide.body;
    if (bf === 'bodySimple' && !slide.body) slide.body = slide.bodySimple;
  }

  var lhEl = es.querySelector('[data-field="comp-lh"]');
  var rhEl = es.querySelector('[data-field="comp-rh"]');
  var lbEl = es.querySelector('#editableBodyLeft');
  var rbEl = es.querySelector('#editableBodyRight');
  if (lhEl && rhEl && lbEl && rbEl) {
    slide[bf] = lhEl.textContent.trim() + '\n' + serializeBodyEl(lbEl) +
      '\n---\n' + rhEl.textContent.trim() + '\n' + serializeBodyEl(rbEl);
    if (bf === 'body' && !slide.bodySimple) slide.bodySimple = slide.body;
    if (bf === 'bodySimple' && !slide.body) slide.body = slide.bodySimple;
  }

  syncSizeKeys(es, slide);
  save();
  renderSlideList();
}

function serializeBodyEl(bodyEl) {
  return Array.from(bodyEl.querySelectorAll('[data-type]')).map(function(el) {
    var type = el.dataset.type;
    var text = el.textContent.trim();
    if (!text) return null;
    if (type === 'bullet')    return '- ' + text;
    if (type === 'highlight') return '★ ' + text;
    if (type === 'quote')     return '> ' + text;
    return text;
  }).filter(function(l){return l !== null;}).join('\n');
}

function updateFmtToolbar(type) {
  var map = { para:'Para', bullet:'Bullet', highlight:'Hl', quote:'Quote' };
  ['Para','Bullet','Hl','Quote'].forEach(function(n) {
    var btn = document.getElementById('fbt' + n);
    if (btn) btn.classList.remove('fmt-active');
  });
  if (type && map[type]) {
    var btn = document.getElementById('fbt' + map[type]);
    if (btn) btn.classList.add('fmt-active');
  }
}

function setLineType(type) {
  if (!focusedLineEl || !focusedLineEl.dataset) return;
  focusedLineEl.dataset.type = type;
  updateFmtToolbar(type);
  serializeFromCanvas();
}

function addBodyLine() {
  var bodyEl = document.querySelector('.editable-body');
  if (!bodyEl) return;
  var newLine = document.createElement('div');
  newLine.className = 'body-line';
  newLine.dataset.type = focusedLineEl && focusedLineEl.dataset ? focusedLineEl.dataset.type : 'bullet';
  newLine.contentEditable = 'true';
  newLine.innerHTML = '<br>';
  if (focusedLineEl && focusedLineEl.parentElement === bodyEl) {
    focusedLineEl.after(newLine);
  } else {
    bodyEl.appendChild(newLine);
  }
  newLine.focus();
  focusedLineEl = newLine;
  updateFmtToolbar(newLine.dataset.type);
}

function removeBodyLine() {
  if (!focusedLineEl) return;
  var body = focusedLineEl.parentElement;
  if (!body || body.querySelectorAll('[data-type]').length <= 1) return;
  var prev = focusedLineEl.previousElementSibling || focusedLineEl.nextElementSibling;
  focusedLineEl.remove();
  focusedLineEl = prev;
  if (prev) { prev.focus(); updateFmtToolbar(prev.dataset.type); }
  serializeFromCanvas();
}

function changeType(type) {
  if (selectedIndex < 0) return;
  slides[selectedIndex].type = type;
  save(); renderSlideList(); renderCanvasSlide();
}

function changeMediaType(mt) {
  if (selectedIndex < 0) return;
  slides[selectedIndex].mediaType = mt;
  save(); renderCanvasSlide();
}

function changeMediaUrl(val) {
  if (selectedIndex < 0) return;
  slides[selectedIndex].mediaUrl = val;
  save();
  var es = document.getElementById('editableSlide');
  if (es) { es.innerHTML = '<div class="slide-bg-glow"></div>' + buildEditableSlideHTML(slides[selectedIndex]); attachEditListeners(slides[selectedIndex]); }
}

/* ─── ADD / MOVE / DELETE ───────────────────────────────────────── */
function addSlide() {
  slides.push({ id: nextId++, type:'content', title:'New Slide', body:'- Point one\n- Point two\n- Point three', bodySimple:'- Point one\n- Point two\n- Point three', note:'', mediaType:'youtube', mediaUrl:'', mediaCaption:'' });
  save(); renderSlideList(); selectSlide(slides.length - 1);
  document.getElementById('slideList').scrollTop = 99999;
}

function moveSlideToIndex(from, to) {
  if (from === to || from < 0 || to < 0 || from >= slides.length || to >= slides.length) return;
  const moved = slides.splice(from, 1)[0];
  slides.splice(to, 0, moved);
  if (selectedIndex === from) {
    selectedIndex = to;
  } else if (from < to) {
    if (selectedIndex > from && selectedIndex <= to) selectedIndex--;
  } else {
    if (selectedIndex >= to && selectedIndex < from) selectedIndex++;
  }
  save(); renderSlideList(); renderCanvasSlide();
}

function moveSlide(i, dir) {
  moveSlideToIndex(i, i + dir);
}

function confirmDelete() {
  if (slides.length <= 1) return;
  if (!confirm('Delete this slide?')) return;
  slides.splice(selectedIndex, 1);
  selectedIndex = Math.min(selectedIndex, slides.length - 1);
  save(); renderSlideList(); renderCanvasSlide();
  document.getElementById('deleteBtn').style.display = slides.length > 1 ? '' : 'none';
}

function resetDefaults() {
  if (!confirm('Reset all slides to defaults? Your edits will be lost.')) return;
  slides = defaultCopy(); nextId = 100; selectedIndex = 0;
  save(); renderSlideList(); renderCanvasSlide();
  showToast('Reset to defaults');
}

/* ─── PRESENTATION ──────────────────────────────────────────────── */
function enterPresent() {
  presentIndex = 0; notesVisible = false;
  document.getElementById('notesOverlay').classList.remove('visible');
  document.getElementById('notesBtn').classList.remove('notes-active');
  document.getElementById('presentOverlay').classList.add('active');
  renderPresentSlide();
}
function exitPresent() { document.getElementById('presentOverlay').classList.remove('active'); }
function nextSlide() { if (presentIndex < slides.length - 1) { presentIndex++; renderPresentSlide(); } }
function prevSlide() { if (presentIndex > 0) { presentIndex--; renderPresentSlide(); } }
function toggleNotes() {
  notesVisible = !notesVisible;
  document.getElementById('notesOverlay').classList.toggle('visible', notesVisible);
  document.getElementById('notesBtn').classList.toggle('notes-active', notesVisible);
}
function goToSlide(i) { presentIndex = i; renderPresentSlide(); }

function renderPresentSlide() {
  const slide = slides[presentIndex];
  if (!slide) return;
  const container = document.getElementById('presentSlide');
  container.className = 'type-' + slide.type + (vocabMode === 'simple' ? ' simple-mode' : '');
  applySlideBg(container, slide);
  document.getElementById('slideContentArea').innerHTML = buildSlideHTML(slide);
  applyTextScale(container, slide);
  applyElementSizes(document.getElementById('slideContentArea'), slide);
  renderImageLayers(container, slide);
  renderTextBoxes(container, slide);
  applyContentOffset(container, slide);
  document.getElementById('notesText').textContent = slide.note || 'No presenter notes.';
  document.getElementById('slideCounter').textContent = (presentIndex+1) + ' / ' + slides.length;
  // Vocab badge
  const badge = document.getElementById('vocabBadge');
  badge.className = 'vocab-badge ' + vocabMode;
  badge.textContent = vocabMode === 'simple' ? 'Child-Friendly' : 'Advanced';
  // Progress dots
  document.getElementById('progressDots').innerHTML = slides.map(function(_, i) {
    return '<div class="prog-dot' + (i === presentIndex ? ' active' : '') + '" onclick="goToSlide(' + i + ')"></div>';
  }).join('');
  document.getElementById('prevBtn').disabled = presentIndex === 0;
  document.getElementById('nextBtn').disabled = presentIndex === slides.length - 1;
}

/* ─── GET BODY for current vocab mode ──────────────────────────── */
function getBody(slide) {
  if (vocabMode === 'simple' && slide.bodySimple) return slide.bodySimple;
  return slide.body || '';
}

/* ─── BUILD SLIDE HTML ──────────────────────────────────────────── */
function buildSlideHTML(slide) {
  const type = slide.type;
  const body = getBody(slide);

  if (type === 'title') {
    const sub = body.split('\n').filter(function(l){return l.trim();})[0] || '';
    return '<div class="slide-content sc-title">' +
      '<div class="slide-eyebrow">Pillar I &nbsp;·&nbsp; What We Believe</div>' +
      '<h1>' + formatTitle(slide.title) + '</h1>' +
      (sub ? '<div class="slide-subtitle">' + escHtml(sub) + '</div>' : '') +
    '</div>';
  }

  if (type === 'question-opening') {
    const lines = body.split('\n').filter(function(l){return l.trim();});
    return '<div class="slide-content sc-question-opening">' +
      '<div class="qo-label">Opening Question</div>' +
      '<div class="qo-text">' + lines.map(function(l){ return escHtml(l); }).join('<br>') + '</div>' +
    '</div>';
  }

  if (type === 'scripture') {
    const lines = body.split('\n').filter(function(l){return l.trim();});
    const quote = lines[0] || '';
    const rest  = lines.slice(1);
    return '<div class="slide-content sc-scripture">' +
      '<div class="scripture-ref">' + escHtml(slide.title) + '</div>' +
      '<div class="scripture-quote">' + escHtml(quote) + '</div>' +
      (rest.length ? '<div class="scripture-notes">' + parseLines(rest) + '</div>' : '') +
    '</div>';
  }

  if (type === 'callout') {
    return '<div class="slide-content sc-callout">' +
      '<h2>' + escHtml(slide.title) + '</h2>' +
      '<div class="callout-body">' + parseLines(body.split('\n').filter(function(l){return l.trim();})) + '</div>' +
    '</div>';
  }

  if (type === 'discussion') {
    const lines = body.split('\n').filter(function(l){return l.trim();});
    let n = 1, qHtml = '';
    lines.forEach(function(line) {
      const hl = line.startsWith('★ ');
      const txt = line.startsWith('- ') ? line.slice(2) : (hl ? line.slice(2) : line);
      qHtml += '<li data-num="' + n++ + '"' + (hl ? ' class="highlight"' : '') + '>' + escHtml(txt) + '</li>';
    });
    return '<div class="slide-content sc-discussion">' +
      '<div class="disc-label">Discussion</div>' +
      '<h2>' + escHtml(slide.title) + '</h2>' +
      '<ul class="disc-questions">' + qHtml + '</ul>' +
    '</div>';
  }

  if (type === 'takehome') {
    const lines = body.split('\n').filter(function(l){return l.trim();});
    return '<div class="slide-content sc-takehome">' +
      '<div class="th-icon">🕯</div>' +
      '<div class="th-label">Take-Home</div>' +
      '<h2>' + escHtml(slide.title) + '</h2>' +
      '<div class="th-body">' + lines.map(function(l){ return '<p>' + escHtml(l) + '</p>'; }).join('') + '</div>' +
    '</div>';
  }

  if (type === 'split') {
    return '<div class="slide-content sc-split">' +
      '<div class="split-left">' +
        '<div class="split-eyebrow">Pillar I · What We Believe</div>' +
        '<h2 class="split-heading">' + formatTitle(slide.title) + '</h2>' +
      '</div>' +
      '<div class="split-divider"></div>' +
      '<div class="split-right">' +
        '<div class="split-body">' + parseLines(body.split('\n').filter(function(l){return l.trim();})) + '</div>' +
      '</div>' +
    '</div>';
  }

  if (type === 'definition') {
    return '<div class="slide-content sc-definition">' +
      '<div class="def-eyebrow">Key Term</div>' +
      '<div class="def-term">' + escHtml(slide.title) + '</div>' +
      '<div class="def-rule"></div>' +
      '<div class="def-body">' + parseLines(body.split('\n').filter(function(l){return l.trim();})) + '</div>' +
    '</div>';
  }

  if (type === 'comparison') {
    var halves = body.split(/\n-{3,}\n/);
    var leftLines  = (halves[0] || '').trim().split('\n').filter(function(l){return l.trim();});
    var rightLines = (halves[1] || '').trim().split('\n').filter(function(l){return l.trim();});
    var leftHead   = leftLines[0]  || '';
    var rightHead  = rightLines[0] || '';
    var leftBody   = parseLines(leftLines.slice(1));
    var rightBody  = parseLines(rightLines.slice(1));
    return '<div class="slide-content sc-comparison">' +
      (slide.title ? '<div class="comp-header">' + escHtml(slide.title) + '</div>' : '') +
      '<div class="comp-grid">' +
        '<div class="comp-col">' +
          (leftHead  ? '<div class="comp-col-heading">' + escHtml(leftHead)  + '</div>' : '') +
          '<div class="comp-col-body">' + leftBody  + '</div>' +
        '</div>' +
        '<div class="comp-divider"><div class="comp-vs">vs.</div></div>' +
        '<div class="comp-col">' +
          (rightHead ? '<div class="comp-col-heading">' + escHtml(rightHead) + '</div>' : '') +
          '<div class="comp-col-body">' + rightBody + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  if (type === 'visual') {
    return '<div class="slide-content sc-visual">' +
      '<div class="visual-title">' + escHtml(slide.title || '') + '</div>' +
      '<div class="visual-rule"></div>' +
      visualLinkHTML(slide) +
    '</div>';
  }

  if (type === 'media') {
    var mt  = slide.mediaType || 'youtube';
    var url = slide.mediaUrl  || '';
    var mediaHtml;
    if (mt === 'youtube') {
      var vid = extractYoutubeId(url);
      mediaHtml = vid
        ? '<div class="media-frame-wrap"><iframe class="media-iframe" src="https://www.youtube-nocookie.com/embed/' + vid + '?rel=0&modestbranding=1" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture"></iframe></div>'
        : '<div class="media-placeholder">Paste a YouTube URL in the editor to embed the video here.</div>';
    } else {
      mediaHtml = url
        ? '<img class="media-img" src="' + escHtml(url) + '" alt="' + escHtml(slide.title) + '">'
        : '<div class="media-placeholder">Paste an image URL in the editor.</div>';
    }
    return '<div class="slide-content sc-media">' +
      (slide.title ? '<div class="media-title">' + escHtml(slide.title) + '</div>' : '') +
      mediaHtml +
      (slide.mediaCaption ? '<div class="media-caption">' + escHtml(slide.mediaCaption) + '</div>' : '') +
    '</div>';
  }

  // Default: content
  return '<div class="slide-content sc-content">' +
    '<div class="slide-label">Pillar I · What We Believe</div>' +
    '<h2>' + escHtml(slide.title) + '</h2>' +
    '<div class="slide-body">' + parseLines(body.split('\n').filter(function(l){return l.trim();})) + '</div>' +
  '</div>';
}

/* ─── PARSE BODY LINES ──────────────────────────────────────────── */
function parseLines(lines) {
  let html = '', inList = false;
  lines.forEach(function(line) {
    const bullet = line.startsWith('- ') || line.startsWith('★ ');
    if (bullet && !inList) { html += '<ul>'; inList = true; }
    if (!bullet && inList) { html += '</ul>'; inList = false; }
    if      (line.startsWith('- '))  html += '<li>' + escHtml(line.slice(2)) + '</li>';
    else if (line.startsWith('★ '))  html += '<li class="highlight">' + escHtml(line.slice(2)) + '</li>';
    else if (line.startsWith('> '))  html += '<blockquote>' + escHtml(line.slice(2)) + '</blockquote>';
    else                             html += '<p>' + escHtml(line) + '</p>';
  });
  if (inList) html += '</ul>';
  return html;
}

/* ─── HELPERS ───────────────────────────────────────────────────── */

function extractYoutubeId(url) {
  if (!url) return '';
  var m = url.match(/(?:v=|youtu\.be\/|\/embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatTitle(t) {
  const w = (t||'').split(' ');
  if (w.length <= 1) return escHtml(t);
  const last = w.pop();
  return escHtml(w.join(' ')) + ' <em>' + escHtml(last) + '</em>';
}
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(function(){ el.classList.remove('show'); }, 2000);
}

/* ─── KEYBOARD ──────────────────────────────────────────────────── */
document.addEventListener('keydown', function(e) {
  if (!document.getElementById('presentOverlay').classList.contains('active')) return;
  if (e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') { e.preventDefault(); nextSlide(); }
  else if (e.key==='ArrowLeft'||e.key==='ArrowUp')             { e.preventDefault(); prevSlide(); }
  else if (e.key==='Escape')                                    exitPresent();
  else if (e.key==='n'||e.key==='N')                            toggleNotes();
});
</script>
