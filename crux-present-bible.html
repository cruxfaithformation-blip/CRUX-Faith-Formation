<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Presentation: The Bible, God's Story — CRUX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --navy: #1a1f36; --navy-deep: #0f1222; --navy-mid: #252b47;
  --gold: #d4a574; --gold-light: #e8c99a; --gold-pale: #fdf8f2;
  --cream: #faf8f4; --white: #fff;
  --text: #1a1f36; --muted: #6b7280;
  --border: rgba(26,31,54,0.1); --sidebar: #141829;
}
html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; background: var(--cream); }

/* ─── EDITOR SHELL ──────────────────────────────────────────────── */
#editorShell { display: flex; flex-direction: column; height: 100vh; }

/* Header */
#editorHeader {
  height: 56px; background: var(--navy-deep); flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.25rem; border-bottom: 1px solid rgba(212,165,116,0.12);
  gap: 1rem; z-index: 10;
}
.hdr-logo {
  font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 900;
  letter-spacing: 4px; color: var(--gold); text-decoration: none; flex-shrink: 0;
}
.hdr-title {
  font-size: 0.78rem; font-weight: 500; color: rgba(255,255,255,0.45);
  letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hdr-title span { color: rgba(255,255,255,0.2); margin: 0 0.4rem; }
.hdr-mid { display: flex; align-items: center; gap: 0.75rem; flex: 1; justify-content: center; }
.hdr-actions { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0; }
.hdr-btn {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
  padding: 0.4rem 0.9rem; border-radius: 4px; cursor: pointer; border: none;
  transition: all 0.15s; white-space: nowrap;
}
.hdr-btn.ghost { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.55); }
.hdr-btn.ghost:hover { background: rgba(255,255,255,0.13); color: rgba(255,255,255,0.8); }
.hdr-btn.present { background: var(--gold); color: var(--navy); }
.hdr-btn.present:hover { opacity: 0.9; }
.hdr-btn.danger { background: rgba(163,45,45,0.15); color: #e07070; }
.hdr-btn.danger:hover { background: rgba(163,45,45,0.28); }

/* Vocab toggle (shared style for header + present controls) */
.vocab-toggle {
  display: flex; align-items: center;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px; padding: 3px; gap: 2px; flex-shrink: 0;
}
.vocab-toggle .vtog-label {
  font-size: 0.62rem; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,0.3); padding: 0 0.4rem; white-space: nowrap;
}
.vtog {
  font-size: 0.68rem; font-weight: 600; letter-spacing: 0.3px;
  padding: 0.28rem 0.7rem; border-radius: 4px; cursor: pointer;
  border: none; background: transparent; color: rgba(255,255,255,0.4);
  transition: all 0.15s; white-space: nowrap;
}
.vtog.active { background: var(--gold); color: var(--navy); }
.vtog:not(.active):hover { color: rgba(255,255,255,0.7); }

/* Editor body */
#editorBody { display: flex; flex: 1; overflow: hidden; }

/* Slide list sidebar */
#slideList {
  width: 240px; flex-shrink: 0; background: var(--sidebar);
  overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.05);
  display: flex; flex-direction: column;
}
#slideList::-webkit-scrollbar { width: 4px; }
#slideList::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

.slide-thumb {
  padding: 0.75rem 0.9rem; cursor: pointer;
  border-left: 3px solid transparent;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: all 0.13s; display: flex; gap: 0.65rem; align-items: flex-start;
}
.slide-thumb:hover { background: rgba(255,255,255,0.04); }
.slide-thumb.active { border-left-color: var(--gold); background: rgba(212,165,116,0.06); }
.thumb-num {
  flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.4);
  font-size: 0.65rem; font-weight: 700; display: flex;
  align-items: center; justify-content: center; margin-top: 1px;
}
.slide-thumb.active .thumb-num { background: var(--gold); color: var(--navy); }
.thumb-info { flex: 1; min-width: 0; }
.thumb-title {
  font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.65);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;
}
.slide-thumb.active .thumb-title { color: var(--gold-light); }
.thumb-type { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.25); }
.thumb-actions { display: flex; flex-direction: column; gap: 2px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
.slide-thumb:hover .thumb-actions { opacity: 1; }
.thumb-move {
  background: rgba(255,255,255,0.08); border: none; color: rgba(255,255,255,0.5);
  width: 18px; height: 18px; border-radius: 3px; cursor: pointer; font-size: 9px;
  display: flex; align-items: center; justify-content: center; transition: all 0.12s;
}
.thumb-move:hover { background: rgba(212,165,116,0.2); color: var(--gold); }

.slide-thumb[draggable="true"] { cursor: grab; }
.slide-thumb[draggable="true"]:active { cursor: grabbing; }
.slide-thumb.dragging { opacity: 0.3; }
.slide-thumb.drag-over { background: rgba(212,165,116,0.1) !important; border-top: 2px solid var(--gold-light); }

#addSlideBtn {
  margin: 0.75rem; padding: 0.65rem;
  background: rgba(212,165,116,0.08); border: 1px dashed rgba(212,165,116,0.25);
  border-radius: 6px; color: rgba(212,165,116,0.6);
  font-size: 0.72rem; font-weight: 600; letter-spacing: 0.5px;
  cursor: pointer; text-align: center; transition: all 0.15s; flex-shrink: 0;
}
#addSlideBtn:hover { background: rgba(212,165,116,0.14); color: var(--gold); border-color: rgba(212,165,116,0.5); }

/* WYSIWYG Canvas */
#slideCanvas {
  flex: 1; overflow-y: auto; background: #0d0f1a;
  display: flex; flex-direction: column; align-items: center;
  padding: 1.25rem; gap: 1rem;
}
#slideCanvas::-webkit-scrollbar { width: 5px; }
#slideCanvas::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
.wysiwyg-empty {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.2); gap: 0.5rem; text-align: center;
}
.wysiwyg-empty .ep-icon { font-size: 2.5rem; opacity: 0.4; }
.wysiwyg-empty p { font-size: 0.85rem; }

/* 16:9 slide wrapper */
.wysiwyg-wrapper {
  width: 100%; max-width: 1100px; flex-shrink: 0;
  aspect-ratio: 16 / 9; position: relative;
  border-radius: 6px; overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}

/* Editable slide surface — mirrors #presentSlide backgrounds */
#editableSlide {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 4rem 6rem; overflow: hidden; background: var(--navy-deep);
}
#editableSlide.type-title    { background: linear-gradient(150deg,#0a0d1c 0%,#1a1f36 60%,#1e2545 100%); }
#editableSlide.type-callout  { background: var(--navy); }
#editableSlide.type-takehome { background: linear-gradient(135deg,#0f1222 0%,#1a1f36 100%); }
#editableSlide.type-media    { background: #050810; }
#editableSlide.type-definition { background: linear-gradient(160deg,#060810 0%,#141829 100%); }
#editableSlide.type-comparison { background: var(--navy); }

/* contenteditable base */
[contenteditable] { outline: none; }
.editable-field { cursor: text; border-radius: 3px; white-space: pre-wrap; transition: box-shadow 0.15s; }
.editable-field:hover { box-shadow: 0 0 0 1px rgba(212,165,116,0.25); }
.editable-field:focus { box-shadow: 0 0 0 1.5px rgba(212,165,116,0.5); }
[contenteditable]:empty::before { content: attr(data-placeholder); opacity: 0.22; pointer-events: none; font-style: italic; }

/* Editable body lines */
.editable-body { outline: none; width: 100%; }
.body-line { display: block; outline: none; cursor: text; border-radius: 3px; min-height: 1.2em; white-space: pre-wrap; transition: box-shadow 0.1s; }
.body-line:focus { box-shadow: 0 0 0 1px rgba(212,165,116,0.35); }
.body-line[data-type="bullet"] {
  font-size: clamp(1rem,2.2vw,1.35rem); color: rgba(255,255,255,0.8);
  padding: 0.4rem 0 0.4rem 1.5em;
  border-bottom: 1px solid rgba(255,255,255,0.06); position: relative;
}
.body-line[data-type="bullet"]::before { content: '—'; color: var(--gold); font-size: 0.85em; position: absolute; left: 0; top: 0.4rem; pointer-events: none; }
.body-line[data-type="highlight"] {
  font-size: clamp(1rem,2.2vw,1.35rem); color: var(--gold-light); font-weight: 600;
  padding: 0.4rem 0 0.4rem 1.5em;
  border-bottom: 1px solid rgba(255,255,255,0.06); position: relative;
}
.body-line[data-type="highlight"]::before { content: '★'; color: var(--gold); position: absolute; left: 0; top: 0.4rem; pointer-events: none; }
.body-line[data-type="quote"] {
  border-left: 3px solid var(--gold); padding: 0.6rem 1.25rem; margin: 0.75rem 0;
  font-style: italic; font-family: 'Playfair Display',serif;
  font-size: clamp(1rem,2.2vw,1.35rem); color: rgba(255,255,255,0.7);
}
.body-line[data-type="para"] { font-size: clamp(1rem,2.2vw,1.4rem); color: rgba(255,255,255,0.8); margin-bottom: 0.4rem; padding: 0.2rem 0; }

/* Formatting toolbar — top-right of the wrapper */
.fmt-toolbar {
  position: absolute; top: 0.55rem; right: 0.55rem; z-index: 20;
  display: flex; align-items: center; gap: 0.25rem;
  background: rgba(8,10,22,0.92); backdrop-filter: blur(6px);
  border: 1px solid rgba(212,165,116,0.18); border-radius: 6px;
  padding: 0.28rem 0.4rem;
}
.fmt-lbl { font-size: 0.55rem; color: rgba(255,255,255,0.25); letter-spacing: 1px; text-transform: uppercase; padding-right: 0.2rem; }
.fmt-btn {
  font-size: 0.63rem; font-weight: 700; padding: 0.25rem 0.55rem; border-radius: 4px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.5); transition: all 0.12s; white-space: nowrap;
}
.fmt-btn:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.12); }
.fmt-btn.fmt-active { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.fmt-sep { width: 1px; height: 13px; background: rgba(255,255,255,0.1); margin: 0 0.1rem; }
.fmt-size-select {
  font-size: 0.63rem; font-weight: 700; padding: 0.2rem 0.25rem; border-radius: 4px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.8);
}
.fmt-size-select option { background: #0d0f1a; color: #fff; }
.fmt-toolbar { flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 9rem); row-gap: 0.3rem; }
.fmt-swatch {
  width: 16px; height: 16px; border-radius: 50%; padding: 0; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.4); box-sizing: border-box;
}
.fmt-swatch:hover { transform: scale(1.15); }
.fmt-color-input { width: 22px; height: 20px; padding: 0; border: none; background: none; cursor: pointer; }
.size-target-active { outline: 1px dashed rgba(212,165,116,0.55); outline-offset: 3px; }
/* Per-element drag: offsets are stored in cqw/cqh, so both slide surfaces
   are size containers and a moved line lands in the same spot in the
   editor and in present mode. */
#editableSlide, #presentSlide { container-type: size; }
/* Hover tools beside each title/line: drag grip + quick size buttons,
   stacked in the left margin so moving the mouse to them never crosses
   another line. */
.el-tools {
  position: absolute; z-index: 15; display: none; flex-direction: column; align-items: center; gap: 2px;
  width: 26px; box-sizing: border-box; padding: 2px;
  background: rgba(8,10,22,0.92); border: 1px solid rgba(212,165,116,0.4); border-radius: 6px;
  user-select: none;
}
.el-tools.visible { display: flex; }
.el-drag-grip, .el-size-btn {
  width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
  border: none; border-radius: 4px; padding: 0; line-height: 1; font-family: inherit;
}
.el-drag-grip { color: var(--gold); cursor: grab; font-size: 12px; touch-action: none; }
.el-drag-grip:active { cursor: grabbing; }
.el-size-btn { background: rgba(255,255,255,0.1); color: #fff; font-size: 0.6rem; font-weight: 700; cursor: pointer; }
.el-size-btn:hover { background: rgba(212,165,116,0.35); }
.el-size-pct { font-size: 0.5rem; color: rgba(255,255,255,0.7); line-height: 1.2; }
.el-dragging { outline: 1px dashed var(--gold); outline-offset: 3px; }

/* Controls strip below slide */
.wysiwyg-controls {
  width: 100%; max-width: 1100px;
  background: var(--cream); border-radius: 6px;
  border: 1px solid var(--border); padding: 0.85rem 1.1rem;
  display: flex; gap: 1rem; align-items: flex-start;
}
.wys-col { display: flex; flex-direction: column; gap: 0.4rem; }
.wys-col-type { flex: 1; }
.wys-col-notes { flex: 1.6; }
.wys-label { font-size: 0.6rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
.wys-type-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 0.35rem; }
.wys-type-opt {
  padding: 0.38rem 0.3rem; border: 1.5px solid var(--border); border-radius: 5px;
  cursor: pointer; text-align: center; font-size: 0.58rem; font-weight: 600;
  color: var(--muted); background: var(--white); transition: all 0.12s;
}
.wys-type-opt:hover { border-color: var(--gold); color: var(--navy); }
.wys-type-opt.selected { border-color: var(--gold); background: var(--gold-pale); color: var(--navy); }
.wys-type-icon { display: block; font-size: 0.85rem; margin-bottom: 2px; }
.wys-notes-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.35rem; }
.wys-vocab { display: flex; align-items: center; background: var(--navy-deep); border-radius: 5px; padding: 2px; gap: 2px; }
.wvt { font-size: 0.62rem; font-weight: 600; padding: 0.22rem 0.65rem; border-radius: 3px; cursor: pointer; border: none; background: transparent; color: rgba(255,255,255,0.4); transition: all 0.15s; }
.wvt.active { background: var(--gold); color: var(--navy); }
.wys-notes-input {
  width: 100%; font-family: 'Inter',sans-serif; font-size: 0.82rem;
  color: var(--navy); background: #fefef8;
  border: 1.5px solid var(--border); border-radius: 6px;
  padding: 0.5rem 0.75rem; outline: none; resize: vertical;
  min-height: 50px; transition: border-color 0.15s; line-height: 1.55;
}
.wys-notes-input:focus { border-color: var(--gold); }
.wys-input {
  width: 100%; font-family: 'Inter',sans-serif; font-size: 0.82rem;
  color: var(--navy); background: var(--white);
  border: 1.5px solid var(--border); border-radius: 6px;
  padding: 0.45rem 0.7rem; outline: none; margin-bottom: 0.35rem; transition: border-color 0.15s;
}
.wys-input:focus { border-color: var(--gold); }
.wys-media-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; margin-bottom: 0.35rem; }
.wys-media-opt {
  padding: 0.38rem 0.5rem; border: 1.5px solid var(--border); border-radius: 5px;
  cursor: pointer; text-align: center; font-size: 0.68rem; font-weight: 600;
  color: var(--muted); background: var(--white); transition: all 0.12s;
}
.wys-media-opt:hover { border-color: var(--gold); }
.wys-media-opt.selected { border-color: var(--gold); background: var(--gold-pale); color: var(--navy); }
.wys-col-bg { flex: 0 0 auto; }
.wys-col-bgimage { flex: 1; min-width: 160px; }
.wys-col-freeform { flex: 1; min-width: 180px; }
.wys-col-media { flex: 1.4; min-width: 220px; }
.wys-hint { font-size: 0.66rem; color: var(--muted); margin-bottom: 0.3rem; line-height: 1.4; }
.wys-bg-row { display: flex; align-items: center; gap: 0.5rem; }
.wys-color-input {
  width: 38px; height: 32px; padding: 0; border: 1.5px solid var(--border); border-radius: 6px;
  cursor: pointer; background: none;
}
.wys-color-input::-webkit-color-swatch-wrapper { padding: 2px; }
.wys-color-input::-webkit-color-swatch { border: none; border-radius: 4px; }
.wys-bg-reset {
  font-size: 0.68rem; font-weight: 600; color: var(--muted); background: none; border: none;
  cursor: pointer; text-decoration: underline; padding: 0;
}
.wys-bg-reset:hover { color: var(--navy); }
.wys-bg-reset:disabled { opacity: 0.35; cursor: default; text-decoration: none; }
.wys-browse-btn {
  font-size: 0.68rem; font-weight: 600; color: var(--navy); background: var(--gold-pale);
  border: 1.5px solid var(--border); border-radius: 5px; padding: 0.32rem 0.6rem;
  cursor: pointer; white-space: nowrap; transition: all 0.12s;
}
.wys-browse-btn:hover { border-color: var(--gold); }

/* ─── FREE-FLOATING IMAGE LAYERS (drag-drop onto a slide, then move/resize) ─── */
.pv-layer { position: absolute; box-sizing: border-box; z-index: 5; touch-action: none; }
.pv-layer-img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.pv-layer-editable { border: 1.5px dashed transparent; cursor: move; }
.pv-layer-editable:hover, .pv-layer-editable.selected { border-color: rgba(212,165,116,0.7); }
.pv-layer-del {
  position: absolute; top: -11px; right: -11px; width: 20px; height: 20px; border-radius: 50%;
  background: rgba(163,45,45,0.9); color: #fff; border: none; font-size: 11px; line-height: 1; cursor: pointer;
  display: none; align-items: center; justify-content: center; z-index: 7; padding: 0;
}
.pv-layer-resize {
  position: absolute; bottom: -6px; right: -6px; width: 14px; height: 14px; border-radius: 3px;
  background: var(--gold); border: 1.5px solid var(--navy-deep); cursor: nwse-resize;
  display: none; z-index: 7;
}
.pv-layer-editable:hover .pv-layer-del, .pv-layer-editable.selected .pv-layer-del,
.pv-layer-editable:hover .pv-layer-resize, .pv-layer-editable.selected .pv-layer-resize,
.pv-textbox-editable:hover .pv-layer-del, .pv-textbox-editable.selected .pv-layer-del,
.pv-textbox-editable:hover .pv-layer-resize, .pv-textbox-editable.selected .pv-layer-resize { display: block; }
.pv-layer-hint {
  position: absolute; left: 1rem; bottom: 1rem; z-index: 3; pointer-events: none;
  font-family: 'Inter', sans-serif; font-size: 0.68rem; color: rgba(212,165,116,0.4); letter-spacing: 0.5px;
}
#editableSlide.drop-active { outline: 3px dashed var(--gold); outline-offset: -3px; }

/* ─── FREE-FLOATING TEXT BOXES ─────────────────────────────────── */
.pv-textbox { position: absolute; box-sizing: border-box; z-index: 6; touch-action: none; }
.pv-textbox-content {
  width: 100%; height: 100%; outline: none; color: #fff;
  font-family: 'Playfair Display', serif; font-weight: 700; line-height: 1.3;
  overflow: visible; word-wrap: break-word; cursor: text;
  text-shadow: 0 1px 4px rgba(0,0,0,0.55);
}
.pv-textbox-editable { border: 1.5px dashed transparent; }
.pv-textbox-editable:not(.editing) { cursor: move; }
.pv-textbox-editable:not(.editing) .pv-textbox-content { pointer-events: none; }
.pv-textbox-editable:hover, .pv-textbox-editable.selected { border-color: rgba(212,165,116,0.7); }
.pv-textbox-fontctrl {
  position: absolute; top: -34px; left: 0; display: none; align-items: center; gap: 3px;
  background: rgba(8,10,22,0.92); border: 1px solid rgba(212,165,116,0.18); border-radius: 6px;
  padding: 0.22rem 0.35rem; z-index: 8; white-space: nowrap;
}
.pv-textbox-editable.selected .pv-textbox-fontctrl { display: flex; }
.pv-textbox-fontctrl button {
  width: 20px; height: 20px; border-radius: 4px; border: none; cursor: pointer;
  background: rgba(255,255,255,0.1); color: #fff; font-size: 0.62rem; font-weight: 700;
}
.pv-textbox-fontctrl button:hover { background: rgba(212,165,116,0.3); }
.pv-textbox-fontpct { font-size: 0.6rem; color: rgba(255,255,255,0.6); min-width: 30px; text-align: center; }

/* ─── DRAGGABLE STRUCTURED CONTENT (title/body block as a whole) ───
   Separate from the free image/text layers above: this repositions the
   slide's own built-in content block (title, bullets, etc. — whatever
   buildEditableSlideHTML/buildSlideHTML renders for the current type) as
   one unit, so a teacher can shift a title up to make room for an image
   underneath it without needing to rebuild that text as a free text box.
   Position is stored as slide.contentOffsetX/Y in percent of the slide
   box — .slide-content is already position:relative, so left/top percent
   there resolves against the containing block, the same mechanism used
   for image layers/text boxes, which is why it stays consistent between
   the editable canvas and fullscreen Present mode. */
.content-drag-handle {
  position: absolute; top: 0.6rem; left: 0.6rem; z-index: 9;
  display: flex; align-items: center; gap: 0.3rem;
  background: rgba(8,10,22,0.85); border: 1px solid rgba(212,165,116,0.3); border-radius: 6px;
  padding: 0.3rem 0.55rem; cursor: move; touch-action: none;
  font-family: 'Inter', sans-serif; font-size: 0.65rem; color: rgba(255,255,255,0.7);
  opacity: 0.55; transition: opacity 0.15s;
}
.content-drag-handle:hover, .content-drag-handle.dragging { opacity: 1; border-color: var(--gold); color: var(--gold-light); }
.content-drag-reset {
  background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer;
  font-size: 0.65rem; text-decoration: underline; padding: 0 0 0 0.3rem; margin: 0;
}
.content-drag-reset:hover { color: var(--gold); }

/* ─── PRESENTATION OVERLAY ──────────────────────────────────────── */
#presentOverlay {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: var(--navy-deep); flex-direction: column; align-items: stretch;
}
#presentOverlay.active { display: flex; }

#presentSlide {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 4rem 6rem; overflow: hidden; position: relative;
}
#presentSlide.type-title { background: linear-gradient(150deg, #0a0d1c 0%, #1a1f36 60%, #1e2545 100%); }
#presentSlide.type-callout { background: var(--navy); }
#presentSlide.type-takehome { background: linear-gradient(135deg, #0f1222 0%, #1a1f36 100%); }
#presentSlide.type-media { background: #050810; }
#presentSlide.type-content, #presentSlide.type-scripture, #presentSlide.type-discussion,
#presentSlide.type-question-opening, #presentSlide.type-split { background: var(--navy-deep); }
#presentSlide.type-definition { background: linear-gradient(160deg, #060810 0%, #141829 100%); }
#presentSlide.type-comparison { background: var(--navy); }

/* Theme selector */
.theme-picker {
  display: flex; align-items: center; gap: 0.35rem;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px; padding: 4px 8px; flex-shrink: 0;
}
.theme-picker-label {
  font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,0.3); white-space: nowrap; padding-right: 0.25rem;
}
.theme-swatch {
  width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
  border: 2px solid transparent; transition: all 0.15s; flex-shrink: 0;
}
.theme-swatch:hover { transform: scale(1.2); }
.theme-swatch.active { border-color: rgba(255,255,255,0.7); }
.theme-swatch.crux { background: linear-gradient(135deg,#1a1f36 50%,#d4a574 50%); }
.theme-swatch.bright { background: linear-gradient(135deg,#fff3e0 50%,#f57c00 50%); }
.theme-swatch.chalk { background: linear-gradient(135deg,#2d4a2e 50%,#ffd54f 50%); }

/* Global text size control (header) */
.text-scale-ctrl {
  display: flex; align-items: center; gap: 0.3rem;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 6px; padding: 4px 6px; flex-shrink: 0;
}
.tsz-label {
  font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(255,255,255,0.3); white-space: nowrap; padding-right: 0.15rem;
}
.tsz-btn {
  width: 20px; height: 20px; border-radius: 4px; border: none; cursor: pointer;
  background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6);
  font-size: 0.65rem; font-weight: 700; transition: all 0.12s;
  display: flex; align-items: center; justify-content: center;
}
.tsz-btn:hover { background: rgba(212,165,116,0.2); color: var(--gold); }
.tsz-pct { font-size: 0.65rem; font-weight: 600; color: rgba(255,255,255,0.55); min-width: 30px; text-align: center; }
.tsz-reset {
  font-size: 0.6rem; font-weight: 600; color: rgba(255,255,255,0.3); background: none; border: none;
  cursor: pointer; padding: 0 0.2rem; text-decoration: underline;
}
.tsz-reset:hover { color: rgba(255,255,255,0.7); }
.tsz-reset:disabled { opacity: 0.3; cursor: default; text-decoration: none; }

/* Per-slide text size control (controls strip) */
.ts-btn {
  width: 24px; height: 24px; border-radius: 5px; border: 1.5px solid var(--border);
  background: var(--white); color: var(--navy); font-size: 0.65rem; font-weight: 700;
  cursor: pointer; transition: all 0.12s;
}
.ts-btn:hover { border-color: var(--gold); }
.ts-pct { font-size: 0.7rem; font-weight: 600; color: var(--muted); min-width: 32px; text-align: center; }

/* Simple-mode tint — subtle green tint on slide bg to signal the mode */
#presentSlide.simple-mode::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: rgba(59,109,17,0.03);
}

.slide-bg-glow {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 80%, rgba(212,165,116,0.06) 0%, transparent 65%);
}
.slide-content { max-width: 900px; width: 100%; position: relative; z-index: 1; }

/* Visual slide — title across the top, open slate below for image layers.

/* ─── INIT ──────────────────────────────────────────────────────── */
(function init() {
  const saved = localStorage.getItem('crux-present-bible-v1');
  if (saved) {
    try {
      const p = JSON.parse(saved);
      slides = p.slides || defaultCopy();
      nextId  = p.nextId || 100;
      vocabMode = p.vocabMode || 'advanced';
      slideTheme = p.slideTheme || 'crux';
      slideTextScale = p.slideTextScale || 1;
      // After the settings above load, since this saves the whole deck.
      if (p.slides) mergeNewDefaults(p.deckVersion || 1);
    } catch(e) { slides = defaultCopy(); }
  } else {
    slides = defaultCopy();
  }
  syncVocabUI();
  syncThemeUI();
  syncTextScaleUI();
  renderSlideList();
  if (slides.length > 0) selectSlide(0);
})();

function mergeNewDefaults(savedVersion) {
  if (savedVersion >= DECK_VERSION) return;
  defaultCopy().forEach(function(d) {
    // New default images for an existing slide: fill it only if the teacher
    // hasn't added their own (empty, or still holding our pre-loaded 'def-' image).
    // A default slide rebuilt as a different kind of slide: swap it in only if the
    // teacher's copy is still the untouched original (same title, no images added).
    if (d.replaceSince && d.replaceSince > savedVersion) {
      var old = slides.filter(function(s) { return s.id === d.id; })[0];
      if (old && old.type === 'visual' && old.title === (d.replaceIfTitle || 'Bible Scavenger Hunt') && (!old.images || !old.images.length)) {
        var at0 = slides.indexOf(old);
        slides[at0] = JSON.parse(JSON.stringify(d));
      }
    }
    // A background image added to an existing default slide: fill it only if the teacher has none.
    if (d.bgSince && d.bgSince > savedVersion) {
      var bgMine = slides.filter(function(s) { return s.id === d.id; })[0];
      if (bgMine && !bgMine.bgImage) bgMine.bgImage = d.bgImage;
    }
    // A link added to an existing default slide: copy it unless the teacher set their own.
    if (d.linkSince && d.linkSince > savedVersion) {
      var withLink = slides.filter(function(s) { return s.id === d.id; })[0];
      if (withLink && !withLink.linkUrl) { withLink.linkUrl = d.linkUrl; withLink.linkLabel = d.linkLabel; }
    }
    if (d.imagesSince && d.imagesSince > savedVersion) {
      var mine = slides.filter(function(s) { return s.id === d.id; })[0];
      var untouched = mine && mine.type === 'visual' && (!mine.images || mine.images.every(function(l) { return String(l.id).indexOf('def-') === 0; }));
      if (untouched) mine.images = d.images;
    }
    if (!d.since || d.since <= savedVersion) return;
    if (slides.some(function(s) { return s.id === d.id; })) return;
    var at = slides.findIndex(function(s) { return s.id === d.after; });
    if (at < 0) slides.push(d); else slides.splice(at + 1, 0, d);
  });
  save();
}

function defaultCopy() {
  // Deep copy: default slides carry nested image-layer objects that get
  // mutated in place when a teacher moves/resizes them.
  return JSON.parse(JSON.stringify(DEFAULT_SLIDES));
}

/* ─── SAVE ──────────────────────────────────────────────────────── */
/* Wrapped in try/catch because embedded (data: URL) images/backgrounds
   count against the browser's per-origin storage quota (~5-10MB) along
   with everything else in the deck — a failed write here shouldn't throw
   silently and leave the teacher thinking their edit was saved. */
function save() {
  try {
    localStorage.setItem('crux-present-bible-v1', JSON.stringify({ deckVersion: DECK_VERSION, slides: slides, nextId: nextId, vocabMode: vocabMode, slideTheme: slideTheme, slideTextScale: slideTextScale }));
  } catch (e) {
    showToast('Could not save — this deck is too large for browser storage. Try a smaller image, or host it in the repo and paste a URL instead.');
  }
}

function setTheme(theme) {
  slideTheme = theme;
  save();
  syncThemeUI();
  const overlay = document.getElementById('presentOverlay');
  overlay.dataset.theme = theme === 'crux' ? '' : theme;
  showToast(theme === 'bright' ? '🎨 Colorful' : theme === 'chalk' ? '🖍 Chalkboard' : '✦ CRUX Classic');
}

function syncThemeUI() {
  ['crux','bright','chalk'].forEach(function(t) {
    var el = document.getElementById('swatch' + t.charAt(0).toUpperCase() + t.slice(1));
    if (el) el.classList.toggle('active', slideTheme === t);
  });
  var overlay = document.getElementById('presentOverlay');
  if (overlay) overlay.dataset.theme = slideTheme === 'crux' ? '' : slideTheme;
  var wrapper = document.querySelector('.wysiwyg-wrapper');
  if (wrapper) wrapper.dataset.theme = slideTheme === 'crux' ? '' : slideTheme;
}

/* ─── TEXT SIZE ─────────────────────────────────────────────────── */
/* Effective scale = slide's own override if set, else the global default.
   Applied as a CSS transform on .slide-content rather than rewriting every
   font-size rule, since each slide type has its own hand-tuned typography. */
function clampScale(v) {
  v = Math.round(v * 20) / 20; // snap to nearest 5%
  return Math.min(1.35, Math.max(0.75, v));
}

function applyTextScale(root, slide) {
  if (!root) return;
  var el = root.querySelector('.visual-title') || root.querySelector('.slide-content');
  if (!el) return;
  var scale = slide && slide.textScale != null ? slide.textScale : slideTextScale;
  el.style.transform = scale === 1 ? '' : 'scale(' + scale + ')';
}

function syncTextScaleUI() {
  var label = document.getElementById('globalTextScaleLabel');
  var reset = document.getElementById('globalTextScaleReset');
  if (label) label.textContent = Math.round(slideTextScale * 100) + '%';
  if (reset) reset.disabled = slideTextScale === 1;
}

function bumpGlobalTextScale(delta) {
  slideTextScale = clampScale(slideTextScale + delta);
  save();
  syncTextScaleUI();
  if (selectedIndex >= 0) renderCanvasSlide();
}

function resetGlobalTextScale() {
  slideTextScale = 1;
  save();
  syncTextScaleUI();
  if (selectedIndex >= 0) renderCanvasSlide();
}

function bumpSlideTextScale(delta) {
  if (selectedIndex < 0 || selectedIndex >= slides.length) return;
  var slide = slides[selectedIndex];
  var base = slide.textScale != null ? slide.textScale : slideTextScale;
  slide.textScale = clampScale(base + delta);
  save();
  renderCanvasSlide();
}

function resetSlideTextScale() {
  if (selectedIndex < 0 || selectedIndex >= slides.length) return;
  delete slides[selectedIndex].textScale;
  save();
  renderCanvasSlide();
}

/* ─── VOCAB MODE ────────────────────────────────────────────────── */
function setVocab(mode) {
  vocabMode = mode;
  save();
  syncVocabUI();
  if (document.getElementById('presentOverlay').classList.contains('active')) {
    renderPresentSlide();
  }
  showToast(mode === 'simple' ? 'Switched to Child-Friendly' : 'Switched to Advanced');
}

function syncVocabUI() {
  // Editor header toggles
  document.getElementById('eVtogAdv').classList.toggle('active', vocabMode === 'advanced');
  document.getElementById('eVtogSimple').classList.toggle('active', vocabMode === 'simple');
  // Present controls toggles
  document.getElementById('pVtogAdv').classList.toggle('active', vocabMode === 'advanced');
  document.getElementById('pVtogSimple').classList.toggle('active', vocabMode === 'simple');
}

/* ─── BODY TAB (vocab mode for editing) ─────────────────────────── */
function setBodyTabWys(tab) {
  bodyTab = tab;
  const slide = slides[selectedIndex];
  if (!slide) return;
  document.querySelectorAll('.wvt').forEach(function(b) {
    b.classList.toggle('active', (tab === 'advanced' && b.textContent.includes('Advanced')) || (tab === 'simple' && b.textContent.includes('Child')));
  });
  const editableSlide = document.getElementById('editableSlide');
  if (editableSlide) {
    editableSlide.innerHTML = buildEditableSlideHTML(slide);
    attachEditListeners(slide);
  }
}

/* ─── RENDER SLIDE LIST ─────────────────────────────────────────── */
function renderSlideList() {
  const list = document.getElementById('slideList');
  const addBtn = document.getElementById('addSlideBtn');
  list.querySelectorAll('.slide-thumb').forEach(function(el) { el.remove(); });
  slides.forEach(function(slide, i) {
    const el = document.createElement('div');
    el.className = 'slide-thumb' + (i === selectedIndex ? ' active' : '');
    el.setAttribute('draggable', 'true');
    el.onclick = function() { selectSlide(i); };
    const typeLabel = (TYPES.find(function(t) { return t.id === slide.type; }) || {}).label || slide.type;
    el.innerHTML =
      '<div class="thumb-num">' + (i+1) + '</div>' +
      '<div class="thumb-info">' +
        '<div class="thumb-title">' + escHtml(slide.title || 'Untitled') + '</div>' +
        '<div class="thumb-type">' + typeLabel + '</div>' +
      '</div>' +
      '<div class="thumb-actions">' +
        '<button class="thumb-move" onclick="event.stopPropagation();moveSlide(' + i + ',-1)">▲</button>' +
        '<button class="thumb-move" onclick="event.stopPropagation();moveSlide(' + i + ',1)">▼</button>' +
      '</div>';
    el.addEventListener('dragstart', function(e) {
      dragSrcIndex = i;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(i));
      setTimeout(function(){ el.classList.add('dragging'); }, 0);
    });
    el.addEventListener('dragend', function() {
      el.classList.remove('dragging');
      list.querySelectorAll('.slide-thumb').forEach(function(t){ t.classList.remove('drag-over'); });
      dragSrcIndex = -1;
    });
    el.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      list.querySelectorAll('.slide-thumb').forEach(function(t){ t.classList.remove('drag-over'); });
      if (dragSrcIndex !== i) el.classList.add('drag-over');
    });
    el.addEventListener('dragleave', function(e) {
      if (!el.contains(e.relatedTarget)) el.classList.remove('drag-over');
    });
    el.addEventListener('drop', function(e) {
      e.preventDefault();
      e.stopPropagation();
      el.classList.remove('drag-over');
      if (dragSrcIndex < 0 || dragSrcIndex === i) return;
      moveSlideToIndex(dragSrcIndex, i);
    });
    list.insertBefore(el, addBtn);
  });
}

/* ─── SELECT & EDIT ─────────────────────────────────────────────── */
function selectSlide(i) {
  selectedIndex = i;
  renderSlideList();
  renderCanvasSlide();
  document.getElementById('deleteBtn').style.display = slides.length > 1 ? '' : 'none';
}

function updateField(field, value) {
  if (selectedIndex < 0 || selectedIndex >= slides.length) return;
  slides[selectedIndex][field] = value;
  save();
  if (field === 'title') renderSlideList();
}

/* Custom per-slide background overrides the theme/type default.
   Applied with !important priority so it wins over the theme CSS,
   which also uses !important on #presentSlide/#editableSlide backgrounds.
   A bgImage takes priority over a bgColor when both are set — the image
   is composed with a dark navy gradient overlay baked into the same
   `background` shorthand string, so slide text stays readable without
   needing a separate DOM layer or per-theme overrides. */
function applySlideBg(el, slide) {
  if (!el) return;
  if (slide && slide.bgImage) {
    var safeUrl = String(slide.bgImage).replace(/["'()]/g, '');
    var overlay = 'linear-gradient(180deg, rgba(15,18,34,0.55) 0%, rgba(15,18,34,0.82) 100%)';
    el.style.setProperty('background', overlay + ', url(' + safeUrl + ') center / cover no-repeat', 'important');
  } else if (slide && slide.bgColor) {
    el.style.setProperty('background', slide.bgColor, 'important');
  } else {
    el.style.removeProperty('background');
  }
}

function setSlideBg(color) {
  if (selectedIndex < 0 || selectedIndex >= slides.length) return;
  var slide = slides[selectedIndex];
  if (color) slide.bgColor = color; else delete slide.bgColor;
  save();
  applySlideBg(document.getElementById('editableSlide'), slide);
  var input = document.getElementById('bgColorInput');
  var resetBtn = document.getElementById('bgResetBtn');
  if (input) input.value = slide.bgColor || '#141829';
  if (resetBtn) resetBtn.disabled = !slide.bgColor;
}

function setSlideBgImage(url) {
  if (selectedIndex < 0 || selectedIndex >= slides.length) return;
  var slide = slides[selectedIndex];
  var prevImage = slide.bgImage;
  if (url) slide.bgImage = url; else delete slide.bgImage;

  if (url && url.indexOf('data:') === 0) {
    var estBytes = JSON.stringify(slides).length;
    if (estBytes > 4 * 1024 * 1024) {
      slide.bgImage = prevImage;
      showToast('That image would push this deck past the browser storage limit — try a smaller file, or host it in the repo and paste a path instead');
      return;
    }
  }

  save();
  applySlideBg(document.getElementById('editableSlide'), slide);
  var input = document.getElementById('bgImageInput');
  var resetBtn = document.getElementById('bgImageResetBtn');
  var isEmbedded = slide.bgImage && slide.bgImage.indexOf('data:') === 0;
  if (input) {
    input.value = isEmbedded ? '' : (slide.bgImage || '');
    input.placeholder = isEmbedded
      ? '🖼 Local image embedded (~' + Math.round(slide.bgImage.length / 1365) + ' KB) — type a URL to replace'
      : 'or paste an image URL…';
  }
  if (resetBtn) resetBtn.disabled = !slide.bgImage;
}

function handleBgImageFile(inputEl) {
  var file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  if (!/^image\//.test(file.type)) { showToast('Please choose an image file'); return; }
  var MAX_BYTES = 1.5 * 1024 * 1024;
  if (file.size > MAX_BYTES) {
    showToast('That image is ' + (Math.round(file.size / 1024 / 1024 * 10) / 10) + 'MB — please use one under 1.5MB, or host it in the repo and paste a URL instead');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(e) { setSlideBgImage(e.target.result); };
  reader.onerror = function() { showToast('Could not read that file'); };
  reader.readAsDataURL(file);
}

/* ─── FREE-FLOATING IMAGE LAYERS ─────────────────────────────────── */
var layerNextId = 1;
// Slate area on Visual slides, in % of the slide. Keep in sync with .visual-slate CSS.
var VISUAL_SLATE = { x: 7, y: 19, w: 86, h: 77 };
var activeLayerDrag = null;

function renderImageLayers(container, slide) {
  if (!container) return;
  var old = container.querySelectorAll('.pv-layer');
  for (var i = 0; i < old.length; i++) old[i].remove();
  var interactive = container.id === 'editableSlide';
  var images = (slide && slide.images) || [];
  images.forEach(function(layer) {
    var wrap = document.createElement('div');
    wrap.className = 'pv-layer' + (interactive ? ' pv-layer-editable' : '');
    wrap.style.left = layer.x + '%';
    wrap.style.top = layer.y + '%';
    wrap.style.width = layer.w + '%';
    wrap.style.height = layer.h + '%';
    wrap.dataset.layerId = layer.id;
    var img = document.createElement('img');
    img.className = 'pv-layer-img';
    img.src = layer.src;
    img.alt = '';
    wrap.appendChild(img);
    if (interactive) {
      var del = document.createElement('button');
      del.type = 'button'; del.className = 'pv-layer-del'; del.textContent = '✕'; del.title = 'Remove image';
      del.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
      del.addEventListener('click', function(e) { e.stopPropagation(); removeImageLayer(slide, layer.id); });
      wrap.appendChild(del);
      var handle = document.createElement('div');
      handle.className = 'pv-layer-resize';
      handle.addEventListener('pointerdown', function(e) { startLayerInteraction(e, slide, layer, wrap, 'resize'); });
      wrap.appendChild(handle);
      wrap.addEventListener('pointerdown', function(e) {
        if (e.target === handle || e.target === del) return;
        startLayerInteraction(e, slide, layer, wrap, 'move');
      });
    }
    container.appendChild(wrap);
  });
  if (interactive && !images.length && slide.type !== 'visual') {
    var hint = document.createElement('div');
    hint.className = 'pv-layer-hint';
    hint.textContent = 'Drag & drop an image anywhere on this slide';
    container.appendChild(hint);
  }
}

function startLayerInteraction(e, slide, layer, wrapEl, mode) {
  e.preventDefault();
  e.stopPropagation();
  var container = wrapEl.parentElement;
  var rect = container.getBoundingClientRect();
  var prevSelected = container.querySelectorAll('.pv-layer.selected, .pv-textbox.selected');
  for (var i = 0; i < prevSelected.length; i++) prevSelected[i].classList.remove('selected');
  wrapEl.classList.add('selected');
  activeLayerDrag = {
    slide: slide, layer: layer, el: wrapEl, mode: mode,
    startClientX: e.clientX, startClientY: e.clientY,
    startX: layer.x, startY: layer.y, startW: layer.w, startH: layer.h,
    rectW: rect.width, rectH: rect.height
  };
  window.addEventListener('pointermove', onLayerPointerMove);
  window.addEventListener('pointerup', onLayerPointerUp);
}

function onLayerPointerMove(e) {
  if (!activeLayerDrag) return;
  var d = activeLayerDrag;
  var dxPct = ((e.clientX - d.startClientX) / d.rectW) * 100;
  var dyPct = ((e.clientY - d.startClientY) / d.rectH) * 100;
  if (d.mode === 'move') {
    d.layer.x = Math.max(0, Math.min(100 - d.layer.w, d.startX + dxPct));
    d.layer.y = Math.max(0, Math.min(100 - d.layer.h, d.startY + dyPct));
  } else {
    d.layer.w = Math.max(4, Math.min(100 - d.layer.x, d.startW + dxPct));
    d.layer.h = Math.max(4, Math.min(100 - d.layer.y, d.startH + dyPct));
  }
  d.el.style.left = d.layer.x + '%';
  d.el.style.top = d.layer.y + '%';
  d.el.style.width = d.layer.w + '%';
  d.el.style.height = d.layer.h + '%';
}

function onLayerPointerUp() {
  if (!activeLayerDrag) return;
  activeLayerDrag = null;
  window.removeEventListener('pointermove', onLayerPointerMove);
  window.removeEventListener('pointerup', onLayerPointerUp);
  save();
}

function removeImageLayer(slide, layerId) {
  if (!slide.images) return;
  slide.images = slide.images.filter(function(l) { return l.id !== layerId; });
  save();
  renderCanvasSlide();
}

function addImageLayerFromSrc(src, dropXPct, dropYPct) {
  if (selectedIndex < 0 || selectedIndex >= slides.length) return;
  var slide = slides[selectedIndex];

  if (src.indexOf('data:') === 0) {
    var estBytes = JSON.stringify(slides).length + src.length;
    if (estBytes > 4 * 1024 * 1024) {
      showToast('That image would push this deck past the browser storage limit — try a smaller file, or host it in the repo and paste a path instead');
      return;
    }
  }

  if (!slide.images) slide.images = [];
  if (slide.type === 'visual' && !slide.images.length) {
    slide.images.push(Object.assign({ id: 'img' + (layerNextId++) + '_' + Date.now(), src: src }, VISUAL_SLATE));
    save();
    renderCanvasSlide();
    return;
  }
  var w = 22, h = 22;
  var x = dropXPct != null ? Math.max(0, Math.min(100 - w, dropXPct - w / 2)) : (50 - w / 2);
  var y = dropYPct != null ? Math.max(0, Math.min(100 - h, dropYPct - h / 2)) : (50 - h / 2);
  slide.images.push({ id: 'img' + (layerNextId++) + '_' + Date.now(), src: src, x: x, y: y, w: w, h: h });
  save();
  renderCanvasSlide();
}

function handleSlateFile(inputEl) {
  var file = inputEl.files && inputEl.files[0];
  inputEl.value = '';
  if (!file) return;
  if (!/^image\//.test(file.type)) { showToast('Please choose an image file'); return; }
  if (file.size > 1.5 * 1024 * 1024) {
    showToast('That image is ' + (Math.round(file.size / 1024 / 1024 * 10) / 10) + 'MB — please use one under 1.5MB, or host it in the repo and paste a path instead');
    return;
  }
  var reader = new FileReader();
  reader.onload = function(ev) { addImageLayerFromSrc(ev.target.result); };
  reader.onerror = function() { showToast('Could not read that file'); };
  reader.readAsDataURL(file);
}

function handleSlideDrop(e) {
  e.preventDefault();
  var container = document.getElementById('editableSlide');
  if (!container) return;
  container.classList.remove('drop-active');
  var rect = container.getBoundingClientRect();
  var xPct = ((e.clientX - rect.left) / rect.width) * 100;
  var yPct = ((e.clientY - rect.top) / rect.height) * 100;

  var file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (file) {
    if (!/^image\//.test(file.type)) { showToast('Please drop an image file'); return; }
    var MAX_BYTES = 1.5 * 1024 * 1024;
    if (file.size > MAX_BYTES) {
      showToast('That image is ' + (Math.round(file.size / 1024 / 1024 * 10) / 10) + 'MB — please use one under 1.5MB, or host it in the repo and paste a path instead');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev) { addImageLayerFromSrc(ev.target.result, xPct, yPct); };
    reader.onerror = function() { showToast('Could not read that file'); };
    reader.readAsDataURL(file);
    return;
  }

  var url = (e.dataTransfer && (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain'))) || '';
  url = url.split('\n')[0].trim();
  if (url) addImageLayerFromSrc(url, xPct, yPct);
}

function attachDropZone(el) {
  if (!el) return;
  el.addEventListener('dragover', function(e) { e.preventDefault(); el.classList.add('drop-active'); });
  el.addEventListener('dragleave', function() { el.classList.remove('drop-active'); });
  el.addEventListener('drop', handleSlideDrop);
  el.addEventListener('pointerdown', function(e) {
    if (e.target === el) {
      var sel = el.querySelectorAll('.pv-layer.selected, .pv-textbox.selected');
      for (var i = 0; i < sel.length; i++) sel[i].classList.remove('selected');
    }
  });
}

/* ─── FREE-FLOATING TEXT BOXES ─────────────────────────────────────
   A second, independent overlay alongside the image layers above.
   Interaction model: single pointerdown drags/moves the box UNLESS it's
   in "editing" mode (entered via double-click), which hands normal
   cursor/selection behavior back to the browser. Blurring (click
   elsewhere, Escape) exits editing mode automatically. */
var textBoxNextId = 1;
var activeTextBoxDrag = null;

function renderTextBoxes(container, slide) {
  if (!container) return;
  var old = container.querySelectorAll('.pv-textbox');
  for (var i = 0; i < old.length; i++) old[i].remove();
  var interactive = container.id === 'editableSlide';
  var boxes = (slide && slide.textBoxes) || [];
  boxes.forEach(function(box) {
    var wrap = document.createElement('div');
    wrap.className = 'pv-textbox' + (interactive ? ' pv-textbox-editable' : '');
    wrap.style.left = box.x + '%';
    wrap.style.top = box.y + '%';
    wrap.style.width = box.w + '%';
    wrap.style.height = box.h + '%';
    wrap.dataset.boxId = box.id;

    var content = document.createElement('div');
    content.className = 'pv-textbox-content';
    content.style.fontSize = (box.fontSize || 1.4) + 'rem';
    content.textContent = box.text || '';
    if (box.inline) applyColors(content, box.inline);
    if (interactive) content.contentEditable = 'true';
    wrap.appendChild(content);

    if (interactive) {
      content.addEventListener('input', function() { box.text = content.textContent; save(); });
      content.addEventListener('blur', function() { wrap.classList.remove('editing'); });
      content.addEventListener('keydown', function(e) { if (e.key === 'Escape') content.blur(); });
      wrap.addEventListener('dblclick', function(e) {
        e.stopPropagation();
        wrap.classList.add('editing');
        content.focus();
      });

      var del = document.createElement('button');
      del.type = 'button'; del.className = 'pv-layer-del'; del.textContent = '✕'; del.title = 'Remove text box';
      del.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
      del.addEventListener('click', function(e) { e.stopPropagation(); removeTextBox(slide, box.id); });
      wrap.appendChild(del);

      var handle = document.createElement('div');
      handle.className = 'pv-layer-resize';
      handle.addEventListener('pointerdown', function(e) { startTextBoxInteraction(e, slide, box, wrap, 'resize'); });
      wrap.appendChild(handle);

      var fontctrl = document.createElement('div');
      fontctrl.className = 'pv-textbox-fontctrl';
      var minus = document.createElement('button');
      minus.type = 'button'; minus.textContent = 'A-';
      var pct = document.createElement('span');
      pct.className = 'pv-textbox-fontpct';
      pct.textContent = Math.round((box.fontSize || 1.4) / 1.4 * 100) + '%';
      var plus = document.createElement('button');
      plus.type = 'button'; plus.textContent = 'A+';
      holdToRepeat(minus, function() { setSizeTarget(content); stepSizeTarget(-1); });
      holdToRepeat(plus,  function() { setSizeTarget(content); stepSizeTarget(1); });
      fontctrl.appendChild(minus); fontctrl.appendChild(pct); fontctrl.appendChild(plus);
      wrap.appendChild(fontctrl);

      wrap.addEventListener('pointerdown', function(e) {
        setSizeTarget(content);
        if (wrap.classList.contains('editing')) return;
        if (e.target === handle || e.target === del || fontctrl.contains(e.target)) return;
        startTextBoxInteraction(e, slide, box, wrap, 'move');
      });
    }

    container.appendChild(wrap);
  });
}

/* ─── PER-ELEMENT TEXT SIZE ─────────────────────────────────────────
   Any title, line, subtitle or quote can be sized on its own. Sizes live
   in slide.textSizes keyed by the element's normalized text, so the same
   map applies to both the editor and present-mode markup (which differ in
   structure) without threading ids through every slide-type builder. The
   size is applied with CSS zoom so each element keeps its own
   type-specific clamp() font-size and reflows. Text boxes keep their own
   box.fontSize (rem) but share the same controls. */
var sizeTargetEl = null;
var SIZE_STEP = 0.1, SIZE_MIN = 0.4, SIZE_MAX = 4;

function sizeKey(text) {
  return String(text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function isTextBoxContent(el) {
  return !!(el && el.classList && el.classList.contains('pv-textbox-content'));
}

function applyElementSizes(root, slide) {
  if (!root || !slide) return;
  var map = slide.textSizes || {};
  var offs = slide.textOffsets || {};
  var cols = slide.textColors || {};
  if (!Object.keys(map).length && !Object.keys(offs).length && !Object.keys(cols).length) return;
  var toColor = [];
  var els = root.querySelectorAll('*');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.closest('.pv-textbox, .pv-layer, .content-drag-handle, .fmt-toolbar')) continue;
    var k = sizeKey(el.textContent);
    if (!k || (map[k] == null && !offs[k] && !cols[k])) continue;
    // Only the innermost element carrying this text, so wrappers don't compound the zoom.
    var inner = false;
    for (var c = 0; c < el.children.length; c++) {
      if (sizeKey(el.children[c].textContent) === k) { inner = true; break; }
    }
    if (inner) continue;
    if (map[k] != null) el.style.zoom = map[k];
    if (offs[k]) el.style.translate = offs[k].x + 'cqw ' + offs[k].y + 'cqh';
    if (cols[k]) toColor.push([el, cols[k]]);
  }
  // After the loop: wrapping adds child spans, which would confuse the innermost-match check above.
  toColor.forEach(function(pair) { applyColors(pair[0], pair[1]); });
}

function markSizeKeys(es) {
  var els = es.querySelectorAll('.editable-field, .body-line');
  for (var i = 0; i < els.length; i++) els[i].dataset.sizeKey = sizeKey(els[i].textContent);
}

// Keep a sized element's size when its text is edited.
function syncSizeKeys(es, slide) {
  var els = es.querySelectorAll('[data-size-key]');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    var oldK = el.dataset.sizeKey, newK = sizeKey(el.textContent);
    if (!newK || oldK === newK) continue;
    if (slide.textSizes && slide.textSizes[oldK] != null) {
      slide.textSizes[newK] = slide.textSizes[oldK];
      delete slide.textSizes[oldK];
    }
    if (slide.textOffsets && slide.textOffsets[oldK]) {
      slide.textOffsets[newK] = slide.textOffsets[oldK];
      delete slide.textOffsets[oldK];
    }
    if (slide.textColors && slide.textColors[oldK]) {
      slide.textColors[newK] = slide.textColors[oldK];
      delete slide.textColors[oldK];
    }
    el.dataset.sizeKey = newK;
  }
}

function setSizeTarget(el) {
  if (sizeTargetEl && sizeTargetEl !== el) sizeTargetEl.classList.remove('size-target-active');
  sizeTargetEl = el;
  if (el) el.classList.add('size-target-active');
  syncSizeSelect();
}

function textBoxFor(el) {
  var slide = slides[selectedIndex];
  var wrap = el.closest('.pv-textbox');
  if (!slide || !wrap || !slide.textBoxes) return null;
  return slide.textBoxes.filter(function(b) { return b.id === wrap.dataset.boxId; })[0] || null;
}

function getSizeTargetScale() {
  var el = sizeTargetEl;
  if (!el || !el.isConnected) return 1;
  if (isTextBoxContent(el)) { var box = textBoxFor(el); return box ? (box.fontSize || 1.4) / 1.4 : 1; }
  return parseFloat(el.style.zoom) || 1;
}

function setSizeTargetScale(scale) {
  var el = sizeTargetEl;
  var slide = slides[selectedIndex];
  if (!el || !el.isConnected || !slide) { showToast('Click into a title, line, or text box first'); return; }
  scale = Math.min(SIZE_MAX, Math.max(SIZE_MIN, Math.round(scale * 100) / 100));
  if (isTextBoxContent(el)) {
    var box = textBoxFor(el);
    if (!box) return;
    box.fontSize = Math.round(1.4 * scale * 100) / 100;
    el.style.fontSize = box.fontSize + 'rem';
    var pct = el.parentElement.querySelector('.pv-textbox-fontpct');
    if (pct) pct.textContent = Math.round(scale * 100) + '%';
  } else {
    var k = sizeKey(el.textContent);
    if (!k) { showToast('Type some text first, then size it'); return; }
    if (!slide.textSizes) slide.textSizes = {};
    if (scale === 1) delete slide.textSizes[k]; else slide.textSizes[k] = scale;
    el.dataset.sizeKey = k;
    el.style.zoom = scale === 1 ? '' : scale;
  }
  save();
  syncSizeSelect();
}

function stepSizeTarget(dir) {
  setSizeTargetScale(getSizeTargetScale() + dir * SIZE_STEP);
}

function setSizeTargetPct(val) {
  setSizeTargetScale(parseInt(val, 10) / 100);
  if (sizeTargetEl && sizeTargetEl.isConnected && !isTextBoxContent(sizeTargetEl)) sizeTargetEl.focus();
}

function buildSizeOptions(current) {
  // Literal here (not a top-level var): the init IIFE renders the toolbar before later vars are assigned.
  var list = [50, 75, 90, 100, 110, 125, 150, 175, 200, 250, 300];
  if (list.indexOf(current) < 0) { list.push(current); list.sort(function(a, b) { return a - b; }); }
  return list.map(function(v) {
    return '<option value="' + v + '"' + (v === current ? ' selected' : '') + '>' + v + '%</option>';
  }).join('');
}

function syncSizeSelect() {
  var sel = document.getElementById('fmtSizeSelect');
  if (sel) sel.innerHTML = buildSizeOptions(Math.round(getSizeTargetScale() * 100));
}

// Press = one step; hold = keep stepping quickly until release.
function holdToRepeat(btn, fn) {
  var delayT = null, repeatT = null;
  function stop() { clearTimeout(delayT); clearInterval(repeatT); delayT = repeatT = null; }
  btn.addEventListener('pointerdown', function(e) {
    e.preventDefault(); e.stopPropagation();
    fn();
    delayT = setTimeout(function() { repeatT = setInterval(fn, 70); }, 350);
  });
  btn.addEventListener('mousedown', function(e) { e.preventDefault(); });
  btn.addEventListener('click', function(e) { e.stopPropagation(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(ev) { btn.addEventListener(ev, stop); });
}

/* ─── TEXT COLOR FOR HIGHLIGHTED WORDS ───────────────────────────────
   Highlighted words inside a title/line get their own color. Stored in
   slide.textColors under the element's text key as { t: phrase,
   n: which occurrence of the phrase, c: color }, then re-applied by
   wrapping that phrase in a span after every render (editor and present).
   Text itself stays plain, so every slide-type builder is untouched. */
function TEXT_COLOR_SWATCHES() {
  return [
    { name: 'Gold',  c: '#e8b04b' },
    { name: 'White', c: '#ffffff' },
    { name: 'Red',   c: '#e5645a' },
    { name: 'Blue',  c: '#6ab7ff' },
    { name: 'Green', c: '#7ccf8a' }
  ];
}

var savedTextRange = null;
document.addEventListener('selectionchange', function() {
  var sel = window.getSelection();
  if (!sel.rangeCount) return;
  var r = sel.getRangeAt(0);
  var node = r.commonAncestorContainer;
  var el = node.nodeType === 3 ? node.parentElement : node;
  var host = el && el.closest ? el.closest('#editableSlide .editable-field, #editableSlide .body-line, #editableSlide .pv-textbox-content') : null;
  if (!host) return; // focus moved to the toolbar or color picker: keep the last selection
  savedTextRange = sel.isCollapsed ? null : { range: r.cloneRange(), host: host };
});

function nthIndex(text, phrase, n) {
  var i = -1;
  for (var c = 0; c <= n; c++) { i = text.indexOf(phrase, i + 1); if (i < 0) return -1; }
  return i;
}

function occurrenceBefore(text, phrase, start) {
  var count = 0, i = text.indexOf(phrase);
  while (i >= 0 && i < start) { count++; i = text.indexOf(phrase, i + 1); }
  return count;
}

function clearColorSpans(el) {
  var spans = el.querySelectorAll('span.tc');
  for (var i = 0; i < spans.length; i++) {
    var sp = spans[i];
    while (sp.firstChild) sp.parentNode.insertBefore(sp.firstChild, sp);
    sp.remove();
  }
  el.normalize();
}

// Inline styles on highlighted words: color (c), bold/normal weight (w),
// italic/normal style (s). Entries are { t, n, k, v }; older color-only
// entries are { t, n, c } and still read as kind 'c'.
var INLINE_PROPS = { c: 'color', w: 'fontWeight', s: 'fontStyle' };
function entryKind(e) { return e.k || 'c'; }
function entryVal(e) { return e.k ? e.v : e.c; }

function wrapTextRange(el, start, end, kind, val) {
  var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  var nodes = [], n;
  while ((n = walker.nextNode())) nodes.push(n);
  var pos = 0;
  nodes.forEach(function(node) {
    var ns = pos, ne = pos + node.nodeValue.length;
    pos = ne;
    var a = Math.max(start, ns), b = Math.min(end, ne);
    if (a >= b) return;
    var mid = node;
    if (a > ns) mid = mid.splitText(a - ns);
    if (b < ne) mid.splitText(b - a);
    var span = document.createElement('span');
    span.className = 'tc';
    span.style[INLINE_PROPS[kind]] = val;
    mid.parentNode.insertBefore(span, mid);
    span.appendChild(mid);
  });
}

function applyColors(el, entries) {
  clearColorSpans(el);
  (entries || []).forEach(function(e) {
    var idx = nthIndex(el.textContent, e.t, e.n);
    if (idx >= 0) wrapTextRange(el, idx, idx + e.t.length, entryKind(e), entryVal(e));
  });
}

// Where a host element's inline styles live: text boxes keep them on the
// box itself; built-in titles/lines use slide.textColors keyed by their text.
function inlineStoreFor(host, slide) {
  if (isTextBoxContent(host)) {
    var box = textBoxFor(host);
    return {
      get: function() { return (box && box.inline) || []; },
      set: function(list) { if (!box) return; if (list.length) box.inline = list; else delete box.inline; }
    };
  }
  var k = sizeKey(host.textContent);
  return {
    get: function() { return (slide.textColors && slide.textColors[k]) || []; },
    set: function(list) {
      if (!slide.textColors) slide.textColors = {};
      if (list.length) slide.textColors[k] = list; else delete slide.textColors[k];
      host.dataset.sizeKey = k;
    }
  };
}

function currentSelectionInfo() {
  var slide = slides[selectedIndex];
  var st = savedTextRange;
  if (!slide || !st || !st.host.isConnected ||
      !st.host.contains(st.range.startContainer) || !st.host.contains(st.range.endContainer)) return null;
  var phrase = st.range.toString();
  if (!phrase.trim()) return null;
  var pre = document.createRange();
  pre.selectNodeContents(st.host);
  pre.setEnd(st.range.startContainer, st.range.startOffset);
  var start = pre.toString().length;
  return { slide: slide, host: st.host, range: st.range, phrase: phrase, start: start, end: start + phrase.length, full: st.host.textContent };
}

// Put the selection back on the same words after re-wrapping, so a teacher
// can press B, then I, then pick a color without re-highlighting.
function reselectOffsets(host, start, end) {
  var walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT);
  var pos = 0, n, r = document.createRange(), gotStart = false;
  while ((n = walker.nextNode())) {
    var len = n.nodeValue.length;
    if (!gotStart && start <= pos + len) { r.setStart(n, start - pos); gotStart = true; }
    if (gotStart && end <= pos + len) { r.setEnd(n, end - pos); break; }
    pos += len;
  }
  if (!gotStart) return;
  var sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(r);
  savedTextRange = { range: r.cloneRange(), host: host };
}

// kind/val: the style to add (null val = only remove). removeKinds: which
// existing styles overlapping the selection to drop first.
function setInlineStyle(kind, val, removeKinds) {
  var info = currentSelectionInfo();
  if (!info) { showToast('Highlight some words first'); return; }
  var store = inlineStoreFor(info.host, info.slide);
  var list = store.get().filter(function(e) {
    if (removeKinds.indexOf(entryKind(e)) < 0) return true;
    var i = nthIndex(info.full, e.t, e.n);
    return i < 0 || i >= info.end || i + e.t.length <= info.start;
  });
  if (kind && val != null) list.push({ t: info.phrase, n: occurrenceBefore(info.full, info.phrase, info.start), k: kind, v: val });
  store.set(list);
  applyColors(info.host, list);
  reselectOffsets(info.host, info.start, info.end);
  save();
}

function applyTextColor(color) { setInlineStyle('c', color, ['c']); }

// Bold and italic toggle from what the highlighted words look like now, so
// "I" on a Scripture quote (italic by default) makes it upright, and back.
function toggleInlineStyle(kind) {
  var info = currentSelectionInfo();
  if (!info) { showToast('Highlight some words first'); return; }
  var node = info.range.startContainer;
  var el = node.nodeType === 3 ? node.parentElement : node;
  var cs = getComputedStyle(el);
  var val = kind === 'w'
    ? (parseInt(cs.fontWeight, 10) >= 600 ? '400' : '700')
    : (cs.fontStyle === 'italic' ? 'normal' : 'italic');
  setInlineStyle(kind, val, [kind]);
}

function clearTextColor() {
  var slide = slides[selectedIndex];
  if (currentSelectionInfo()) { setInlineStyle(null, null, ['c', 'w', 's']); return; }
  var el = sizeTargetEl;
  if (!slide || !el || !el.isConnected) { showToast('Highlight the words to reset first'); return; }
  inlineStoreFor(el, slide).set([]);
  clearColorSpans(el);
  save();
}

/* ─── PER-ELEMENT DRAG ──────────────────────────────────────────────
   A grip appears beside whichever title/line is hovered or being edited;
   dragging it moves just that element. Offsets are stored per element
   (same text key as textSizes) in container units. Double-click resets. */
function attachElementDrag(es, slide) {
  var tools = document.createElement('div');
  tools.className = 'el-tools';
  var grip = document.createElement('div');
  grip.className = 'el-drag-grip';
  grip.textContent = '⠿';
  grip.title = 'Drag to move this text · double-click to put it back';
  var plusBtn = document.createElement('button');
  plusBtn.type = 'button'; plusBtn.className = 'el-size-btn'; plusBtn.textContent = 'A+';
  plusBtn.title = 'Bigger (hold to keep growing)';
  var pctLbl = document.createElement('div');
  pctLbl.className = 'el-size-pct';
  var minusBtn = document.createElement('button');
  minusBtn.type = 'button'; minusBtn.className = 'el-size-btn'; minusBtn.textContent = 'A−';
  minusBtn.title = 'Smaller (hold to keep shrinking)';
  tools.appendChild(grip); tools.appendChild(plusBtn); tools.appendChild(pctLbl); tools.appendChild(minusBtn);
  es.appendChild(tools);
  var dragging = null;

  function sizeFromTools(dir) {
    var el = grip.targetEl;
    if (!el) return;
    setSizeTarget(el);
    stepSizeTarget(dir);
    placeGrip(el);
  }
  holdToRepeat(plusBtn, function() { sizeFromTools(1); });
  holdToRepeat(minusBtn, function() { sizeFromTools(-1); });

  function isMovable(el) { return el && es.contains(el) && !el.closest('.pv-textbox'); }
  function placeGrip(el) {
    if (!isMovable(el)) { tools.classList.remove('visible'); grip.targetEl = null; return; }
    var er = es.getBoundingClientRect(), r = el.getBoundingClientRect();
    pctLbl.textContent = Math.round((parseFloat(el.style.zoom) || 1) * 100) + '%';
    tools.classList.add('visible');
    tools.style.left = Math.max(2, r.left - er.left - tools.offsetWidth - 6) + 'px';
    tools.style.top = Math.max(2, Math.min(er.height - tools.offsetHeight - 2, r.top - er.top)) + 'px';
    grip.targetEl = el;
  }
  function offsetOf(el) {
    var t = (el.style.translate || '').match(/(-?[\d.]+)cqw\s+(-?[\d.]+)cqh/);
    return t ? { x: parseFloat(t[1]), y: parseFloat(t[2]) } : { x: 0, y: 0 };
  }
  function setOffset(el, o) {
    el.style.translate = (o.x || o.y) ? (o.x + 'cqw ' + o.y + 'cqh') : '';
  }

  es.addEventListener('mouseover', function(e) {
    if (dragging || tools.contains(e.target)) return;
    var t = e.target.closest('.editable-field, .body-line');
    if (isMovable(t)) placeGrip(t);
  });
  es.addEventListener('mouseleave', function() {
    if (dragging) return;
    placeGrip(sizeTargetEl && !isTextBoxContent(sizeTargetEl) ? sizeTargetEl : null);
  });
  es.addEventListener('focusin', function(e) {
    var t = e.target.closest('.editable-field, .body-line');
    if (isMovable(t)) placeGrip(t);
  });

  grip.addEventListener('pointerdown', function(e) {
    var el = grip.targetEl;
    if (!el) return;
    e.preventDefault(); e.stopPropagation();
    var k = sizeKey(el.textContent);
    if (!k) { showToast('Type some text first, then move it'); return; }
    // Calibrate: how many screen px one cqw/cqh unit moves this element
    // (depends on slide size, the element's zoom, and the slide text scale).
    var start = offsetOf(el);
    var r0 = el.getBoundingClientRect();
    setOffset(el, { x: start.x + 10, y: start.y + 10 });
    var r1 = el.getBoundingClientRect();
    setOffset(el, start);
    var fx = (r1.left - r0.left) / 10 || 1, fy = (r1.top - r0.top) / 10 || 1;
    dragging = { el: el, k: k, start: start, sx: e.clientX, sy: e.clientY, fx: fx, fy: fy, cur: start };
    el.classList.add('el-dragging');
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove', function(e) {
    if (!dragging) return;
    var d = dragging;
    d.cur = {
      x: Math.round((d.start.x + (e.clientX - d.sx) / d.fx) * 10) / 10,
      y: Math.round((d.start.y + (e.clientY - d.sy) / d.fy) * 10) / 10
    };
    setOffset(d.el, d.cur);
    placeGrip(d.el);
  });
  function endDrag() {
    if (!dragging) return;
    var d = dragging;
    dragging = null;
    d.el.classList.remove('el-dragging');
    if (!slide.textOffsets) slide.textOffsets = {};
    if (Math.abs(d.cur.x) < 0.2 && Math.abs(d.cur.y) < 0.2) { delete slide.textOffsets[d.k]; setOffset(d.el, { x: 0, y: 0 }); }
    else slide.textOffsets[d.k] = d.cur;
    d.el.dataset.sizeKey = d.k;
    save();
    placeGrip(d.el);
  }
  grip.addEventListener('pointerup', endDrag);
  grip.addEventListener('pointercancel', endDrag);
  grip.addEventListener('dblclick', function(e) {
    e.stopPropagation();
    var el = grip.targetEl;
    if (!el) return;
    var k = sizeKey(el.textContent);
    if (slide.textOffsets) delete slide.textOffsets[k];
    setOffset(el, { x: 0, y: 0 });
    save();
    placeGrip(el);
  });
}

function wireSizeButtons() {
  sizeTargetEl = null;
  var btns = document.querySelectorAll('#fmtToolbar .fmt-size-btn');
  for (var i = 0; i < btns.length; i++) {
    (function(btn) {
      var dir = parseInt(btn.dataset.sizeDir, 10);
      holdToRepeat(btn, function() { stepSizeTarget(dir); });
    })(btns[i]);
  }
}

function startTextBoxInteraction(e, slide, box, wrapEl, mode) {
  e.preventDefault();
  e.stopPropagation();
  var container = wrapEl.parentElement;
  var rect = container.getBoundingClientRect();
  var prevSelected = container.querySelectorAll('.pv-layer.selected, .pv-textbox.selected');
  for (var i = 0; i < prevSelected.length; i++) prevSelected[i].classList.remove('selected');
  wrapEl.classList.add('selected');
  activeTextBoxDrag = {
    slide: slide, box: box, el: wrapEl, mode: mode,
    startClientX: e.clientX, startClientY: e.clientY,
    startX: box.x, startY: box.y, startW: box.w, startH: box.h,
    rectW: rect.width, rectH: rect.height
  };
  window.addEventListener('pointermove', onTextBoxPointerMove);
  window.addEventListener('pointerup', onTextBoxPointerUp);
}

function onTextBoxPointerMove(e) {
  if (!activeTextBoxDrag) return;
  var d = activeTextBoxDrag;
  var dxPct = ((e.clientX - d.startClientX) / d.rectW) * 100;
  var dyPct = ((e.clientY - d.startClientY) / d.rectH) * 100;
  if (d.mode === 'move') {
    d.box.x = Math.max(0, Math.min(100 - d.box.w, d.startX + dxPct));
    d.box.y = Math.max(0, Math.min(100 - d.box.h, d.startY + dyPct));
  } else {
    d.box.w = Math.max(6, Math.min(100 - d.box.x, d.startW + dxPct));
    d.box.h = Math.max(4, Math.min(100 - d.box.y, d.startH + dyPct));
  }
  d.el.style.left = d.box.x + '%';
  d.el.style.top = d.box.y + '%';
  d.el.style.width = d.box.w + '%';
  d.el.style.height = d.box.h + '%';
}

function onTextBoxPointerUp() {
  if (!activeTextBoxDrag) return;
  activeTextBoxDrag = null;
  window.removeEventListener('pointermove', onTextBoxPointerMove);
  window.removeEventListener('pointerup', onTextBoxPointerUp);
  save();
}

function removeTextBox(slide, boxId) {
  if (!slide.textBoxes) return;
  slide.textBoxes = slide.textBoxes.filter(function(b) { return b.id !== boxId; });
  save();
  renderCanvasSlide();
}

function addTextBox() {
  if (selectedIndex < 0 || selectedIndex >= slides.length) return;
  var slide = slides[selectedIndex];
  if (!slide.textBoxes) slide.textBoxes = [];
  var w = 26, h = 10;
  var newBox = {
    id: 'txt' + (textBoxNextId++) + '_' + Date.now(),
    text: 'New text', x: 50 - w / 2, y: 50 - h / 2, w: w, h: h, fontSize: 1.4
  };
  slide.textBoxes.push(newBox);
  save();
  renderCanvasSlide();
  setTimeout(function() {
    var es = document.getElementById('editableSlide');
    var wrap = es && es.querySelector('.pv-textbox[data-box-id="' + newBox.id + '"]');
    if (!wrap) return;
    wrap.classList.add('editing', 'selected');
    var content = wrap.querySelector('.pv-textbox-content');
    if (!content) return;
    content.focus();
    var range = document.createRange();
    range.selectNodeContents(content);
    var sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }, 0);
}

/* ─── DRAGGABLE STRUCTURED CONTENT BLOCK ───────────────────────────
   Repositions .slide-content (the slide's built-in title/body render,
   whatever the current type produces) as one unit, separate from the
   free image/text layers. Stored as slide.contentOffsetX/Y in percent —
   .slide-content is already position:relative, so left/top percent there
   resolves against the containing block (#editableSlide/#presentSlide),
   the same percent-of-container mechanism the layers above use, which is
   why it stays consistent between the editable canvas and Present mode. */
var activeContentDrag = null;

function applyContentOffset(container, slide) {
  if (!container || (slide && slide.type === 'visual')) return;
  var el = container.querySelector('.slide-content');
  if (!el) return;
  var x = (slide && slide.contentOffsetX) || 0;
  var y = (slide && slide.contentOffsetY) || 0;
  if (x || y) { el.style.left = x + '%'; el.style.top = y + '%'; }
  else { el.style.left = ''; el.style.top = ''; }
}

function renderContentDragHandle(container, slide) {
  if (!container) return;
  var old = container.querySelector('.content-drag-handle');
  if (old) old.remove();
  if (container.id !== 'editableSlide' || slide.type === 'visual') return;
  var handle = document.createElement('div');
  handle.className = 'content-drag-handle';
  handle.title = 'Drag to move the title/text block';
  handle.innerHTML = '⠿ Move Text';
  var hasOffset = !!((slide.contentOffsetX) || (slide.contentOffsetY));
  if (hasOffset) {
    var reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'content-drag-reset';
    reset.textContent = 'Reset';
    reset.addEventListener('pointerdown', function(e) { e.stopPropagation(); });
    reset.addEventListener('click', function(e) {
      e.stopPropagation();
      delete slide.contentOffsetX; delete slide.contentOffsetY;
      save();
      renderCanvasSlide();
    });
    handle.appendChild(reset);
  }
  handle.addEventListener('pointerdown', function(e) { startContentDrag(e, slide, container, handle); });
  container.appendChild(handle);
}

function startContentDrag(e, slide, container, handleEl) {
  e.preventDefault();
  e.stopPropagation();
  if (e.target.classList.contains('content-drag-reset')) return;
  var rect = container.getBoundingClientRect();
  handleEl.classList.add('dragging');
  activeContentDrag = {
    slide: slide, container: container,
    startClientX: e.clientX, startClientY: e.clientY,
    startX: slide.contentOffsetX || 0, startY: slide.contentOffsetY || 0,
    rectW: rect.width, rectH: rect.height
  };
  window.addEventListener('pointermove', onContentPointerMove);
  window.addEventListener('pointerup', onContentPointerUp);
}

function onContentPointerMove(e) {
  if (!activeContentDrag) return;
  var d = activeContentDrag;
  var dxPct = ((e.clientX - d.startClientX) / d.rectW) * 100;
  var dyPct = ((e.clientY - d.startClientY) / d.rectH) * 100;
  d.slide.contentOffsetX = Math.max(-40, Math.min(40, d.startX + dxPct));
  d.slide.contentOffsetY = Math.max(-40, Math.min(40, d.startY + dyPct));
  applyContentOffset(d.container, d.slide);
}

function onContentPointerUp() {
  if (!activeContentDrag) return;
  var d = activeContentDrag;
  activeContentDrag = null;
  window.removeEventListener('pointermove', onContentPointerMove);
  window.removeEventListener('pointerup', onContentPointerUp);
  save();
  renderCanvasSlide();
}

      '<div class="callout-body"><div class="editable-body" id="editableBody">' + buildBodyLines(lines.filter(function(l){return l.trim();})) + '</div></div>' +

  // Default: content
